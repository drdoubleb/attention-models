<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Look Back</title>
<meta name="description" content="An interactive, hands-on tutorial on attention models: train a tiny transformer in your browser on a poem you choose, then take it apart piece by piece.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ============================================================================
   Look Back — an interactive attention-model tutorial
   One file. A real tiny transformer trains in this page; every number is live.

   Three typefaces, three voices:
     Newsreader      the human text — the poem, the headline
     Albert Sans     the tutorial's own voice — explanations, buttons
     JetBrains Mono  the machine — tokens, ids, numbers, matrices
   Three data hues, reserved for the three vectors every token makes:
     amber = query (what I'm looking for)   violet = key (what I advertise)
     aqua  = value (what I hand over)
   Signed numbers use a blue↔red diverging ramp around a neutral middle;
   attention weights (0..1) use a single ink ramp: darker = more attention.
   ========================================================================== */
:root{
  color-scheme:light;
  --bg:#F4F6F9;            /* page ground: cool paper */
  --panel:#FFFFFF;         /* cards, stage */
  --panel-2:#EDF0F5;       /* raised / inset */
  --panel-3:#E3E8EF;
  --line:#CFD6E0;
  --line-soft:#E2E7EE;
  --text:#151A24;
  --muted:#586377;
  --faint:#8791A3;
  --accent:#1F2B47;        /* deep ink-navy: buttons, focus, coach */
  --accent-2:#2F3F66;
  --accent-soft:rgba(31,43,71,.08);
  --accent-ring:rgba(31,43,71,.35);
  --q:#EDA100; --q-ink:#8A5C00; --q-soft:rgba(237,161,0,.16);
  --k:#4A3AA7; --k-ink:#3B2D8D; --k-soft:rgba(74,58,167,.13);
  --v:#1BAF7A; --v-ink:#0B6E4B; --v-soft:rgba(27,175,122,.15);
  --pos:#7A6A52; --pos-soft:rgba(122,106,82,.14);   /* positions: warm slate */
  --neg:#2A78D6; --posv:#E34948; --mid:#F0EFEC;      /* diverging: negative blue ↔ positive red */
  --ink-lo:#F4F6F9; --ink-hi:#151A24;                /* sequential ramp for attention weights */
  --good:#0CA30C; --good-ink:#0A6B0A; --good-soft:rgba(12,163,12,.12);
  --bad:#D03B3B;  --bad-ink:#A12626;  --bad-soft:rgba(208,59,59,.10);
  --shadow:0 10px 30px rgba(21,26,36,.08);
  --r:14px;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F131A; --panel:#171C26; --panel-2:#1E2532; --panel-3:#28303F;
    --line:#354056; --line-soft:#283142;
    --text:#E8ECF3; --muted:#A5AFC2; --faint:#75809A;
    --accent:#C9D3EA; --accent-2:#E2E8F5; --accent-soft:rgba(201,211,234,.10); --accent-ring:rgba(201,211,234,.40);
    --q:#C98500; --q-ink:#F0B640; --q-soft:rgba(201,133,0,.22);
    --k:#9085E9; --k-ink:#B3ABF5; --k-soft:rgba(144,133,233,.18);
    --v:#199E70; --v-ink:#4BD09E; --v-soft:rgba(25,158,112,.20);
    --pos:#B8A88C; --pos-soft:rgba(184,168,140,.16);
    --neg:#3987E5; --posv:#E66767; --mid:#383835;
    --ink-lo:#171C26; --ink-hi:#F2F5FA;
    --good:#0CA30C; --good-ink:#5ED65E; --good-soft:rgba(12,163,12,.18);
    --bad:#E05252; --bad-ink:#FF8A8A; --bad-soft:rgba(224,82,82,.16);
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F131A; --panel:#171C26; --panel-2:#1E2532; --panel-3:#28303F;
  --line:#354056; --line-soft:#283142;
  --text:#E8ECF3; --muted:#A5AFC2; --faint:#75809A;
  --accent:#C9D3EA; --accent-2:#E2E8F5; --accent-soft:rgba(201,211,234,.10); --accent-ring:rgba(201,211,234,.40);
  --q:#C98500; --q-ink:#F0B640; --q-soft:rgba(201,133,0,.22);
  --k:#9085E9; --k-ink:#B3ABF5; --k-soft:rgba(144,133,233,.18);
  --v:#199E70; --v-ink:#4BD09E; --v-soft:rgba(25,158,112,.20);
  --pos:#B8A88C; --pos-soft:rgba(184,168,140,.16);
  --neg:#3987E5; --posv:#E66767; --mid:#383835;
  --ink-lo:#171C26; --ink-hi:#F2F5FA;
  --good:#0CA30C; --good-ink:#5ED65E; --good-soft:rgba(12,163,12,.18);
  --bad:#E05252; --bad-ink:#FF8A8A; --bad-soft:rgba(224,82,82,.16);
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
b,strong{font-weight:600}
code,.mono{font-family:var(--mono)}
.serif{font-family:var(--serif)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none !important}
</style>
<style>
/* ============================================================================
   scene widgets
   ========================================================================== */
h3.sub{margin:18px 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h3.sub .dims{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--faint);font-weight:400}
#readout{
  margin-top:10px;font-size:12.5px;line-height:1.55;color:var(--text);background:var(--panel-2);border:1px solid var(--line-soft);
  border-radius:10px;padding:8px 12px;overflow-x:auto;white-space:nowrap;
}
#readout b{color:var(--text);font-weight:700}
#readout .dim{color:var(--faint)}
.route{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 18px}
.route .pill b{font-family:var(--mono);color:var(--faint);font-weight:500;margin-right:2px}
.pick.own{cursor:default}
.pick.own:hover{transform:none}
.pick.own .btn{align-self:flex-start}

/* -- the 16 slots -- */
.slots{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;margin:6px 0 10px}
.slot{
  position:relative;border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 7px 4px;min-width:38px;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:default;transition:all .2s;color:var(--text);
}
.slot .w{font-family:var(--mono);font-size:13px;line-height:1.1;white-space:pre}
.slot .i{font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.slot .idb{position:absolute;top:-8px;right:-5px;background:var(--accent);color:var(--bg);font-family:var(--mono);font-size:9.5px;border-radius:6px;padding:0 4px;font-weight:600}
.slot.nl .w{color:var(--faint)}
.slots.small .slot{padding:3px 5px 2px;min-width:30px}
.slots.small .slot .w{font-size:11.5px}
.slot.covered{background:repeating-linear-gradient(135deg,var(--panel-3) 0 4px,var(--panel-2) 4px 8px);color:transparent;border-style:dashed}
.slot.covered .w,.slot.covered .i{color:transparent}
.slot.covered .i{color:var(--faint)}
.slot.covered::after{content:"";position:absolute;inset:0;border-radius:6px}
.slot.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slot.focus{border-color:var(--q);background:var(--q-soft);box-shadow:0 0 0 3px var(--q-soft)}
.slot.truth{border-color:var(--good);background:var(--good-soft)}
.slot.wrong{border-color:var(--bad);background:var(--bad-soft)}
.slot.twin{border-color:var(--q);background:var(--q-soft)}
.slot.extra{opacity:.55;border-style:dotted}
.slot.on{border-color:var(--accent);background:var(--accent-soft)}
.slot.gone{opacity:.3;text-decoration:line-through}
.slot.prompt{border-color:var(--pos)}
.slot.gen{border-color:var(--k);background:var(--k-soft);cursor:pointer}
.slot.gen:hover{box-shadow:0 0 0 3px var(--k-soft)}
button.slot{font:inherit}
.slots button.slot{cursor:pointer}
.slots button.slot:hover{border-color:var(--accent)}
.zone.slot.hot{box-shadow:0 0 0 2.5px var(--accent),0 0 18px var(--accent-ring)}

/* -- rounds log (scene 1) -- */
.rounds{display:flex;flex-direction:column;gap:10px}
.round{border:1px solid var(--line-soft);border-left:3px solid var(--bad);border-radius:0 12px 12px 0;padding:10px 14px;background:var(--panel-2);font-size:14px}
.round.ok{border-left-color:var(--good)}
.round .rk{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block}
.round .rv{font-family:var(--mono);font-size:12px;color:var(--muted);display:block;margin:3px 0 6px}
.round p{margin:0 0 6px}

/* -- tiles & scissors (scene 2) -- */
.tiles{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 4px}
.tile{
  font-family:var(--mono);font-size:14px;padding:8px 11px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel-2);white-space:pre;
  transition:all .2s;position:relative;
}
.tile.glued{border-color:var(--q);background:var(--q-soft);border-style:dashed}
.tile.cut{animation:fadein .3s}
.tile.nl{color:var(--faint)}
.tile.click{cursor:pointer}
.tile.click:hover{border-color:var(--accent)}
.tile.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.vocabbox{margin-top:14px}
.vtable{display:grid;grid-template-columns:max-content max-content 1fr max-content;gap:3px 12px;align-items:center;font-family:var(--mono);font-size:12.5px;max-height:300px;overflow:auto;padding:8px 10px;border:1px solid var(--line-soft);border-radius:10px;background:var(--panel-2)}
.vtable .vrow{display:contents}
.vtable .vid{color:var(--faint);text-align:right}
.vtable .vt{white-space:pre}
.vtable .vc{height:10px;background:var(--panel-3);border-radius:0 3px 3px 0;min-width:80px}
.vtable .vc i{display:block;height:100%;background:var(--accent);border-radius:0 3px 3px 0}
.vtable .vn{color:var(--muted)}
.vtable .vrow.top .vt{font-weight:700}
.vtable .vrow.bet .vt::after{content:" ← your bet";color:var(--q-ink);font-size:11px}

/* -- strips -- */
.strip{display:inline-flex;align-items:center;gap:8px;vertical-align:middle;--cell:18px}
.strip .slab{font-family:var(--mono);font-size:12px;color:var(--text);white-space:pre;display:inline-flex;align-items:center;gap:6px;min-width:60px}
.strip .scells{display:inline-grid;grid-auto-flow:column;gap:1.5px}
.strip .sc{width:var(--cell);height:var(--cell);border-radius:3px;background:var(--mid);display:inline-block;transition:background .25s}
.strip .sc.pickable{cursor:pointer}
.strip .sc:hover{outline:2px solid var(--accent);outline-offset:-1px}
.strip.masked .sc{background:repeating-linear-gradient(135deg,var(--panel-3) 0 3px,var(--panel-2) 3px 6px) !important}
.strip .sc.masked{background:repeating-linear-gradient(135deg,var(--panel-3) 0 3px,var(--panel-2) 3px 6px) !important}
.strip .sindex{display:inline-grid;grid-auto-flow:column;gap:1.5px}
.strip .sindex i{width:var(--cell);font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--faint);text-align:center}
.strip .ssum{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.strip.mini{--cell:6px}
.strip.mini .scells{gap:1px}
.strip.q .scells{outline:2px solid var(--q);outline-offset:2px;border-radius:3px}
.strip.k .scells{outline:2px solid var(--k);outline-offset:2px;border-radius:3px}
.strip.v .scells{outline:2px solid var(--v);outline-offset:2px;border-radius:3px}
.pchip .glyph{min-width:0}
.pchip .strip{--cell:6px}

/* -- x0 grid (scene 3) -- */
.xgrid{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.xrow{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:9px;border:1px dashed var(--line-soft);min-height:36px;transition:all .2s}
.xrow.filled{border-style:solid;background:var(--panel)}
.xrow.pos{border-color:var(--pos)}
.xlab{font-family:var(--mono);font-size:12px;display:inline-flex;gap:8px;min-width:78px}
.xlab .i{color:var(--faint);min-width:16px;text-align:right}
.xlab .t{white-space:pre}
.twins{margin:12px 0;font-size:14px;padding:10px 14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line-soft)}
.twins .warn{color:var(--bad-ink);font-weight:600}
.twins .ok{color:var(--good-ink);font-weight:600}
.zone.xrow.hot{box-shadow:0 0 0 2.5px var(--accent)}
.mat .cl.plain{writing-mode:horizontal-tb;transform:none;height:var(--cell);min-height:0;padding:0;justify-content:center;font-size:9.5px}

/* -- pouring (scene 4) -- */
.pourboard{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pour{width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border-radius:10px;border:1px solid var(--line-soft);background:var(--panel-2);transition:all .2s;position:relative}
.pour .gauge{width:22px;height:70px;border-radius:6px;background:var(--panel-3);position:relative;overflow:hidden;cursor:pointer;border:1px solid var(--line-soft)}
.pour .gauge i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ink-hi);transition:height .25s}
.pour .pv{font-family:var(--mono);font-size:11px;color:var(--muted);min-height:14px}
.pour .pl{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:center;line-height:1.2;max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pour .pl span{color:var(--text)}
.pour .pb{display:flex;gap:3px}
.pour .pb button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px;line-height:1;padding:0}
.pour.has{border-color:var(--accent)}
.pour.self{border-color:var(--q)}
.pour.covered{background:repeating-linear-gradient(135deg,var(--panel-3) 0 4px,var(--panel-2) 4px 8px);opacity:.7}
.pour.covered .gauge,.pour.covered .pb{visibility:hidden}
.pour.covered .pl{color:var(--faint)}
.pour.deny{animation:shake .4s}
.ptotal{margin:12px 0 6px;font-size:15px}
.ptotal.full b{color:var(--good-ink)}
.ghostrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}

/* -- ask & offer (scene 5) -- */
.handle{margin-top:10px;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1.5px dashed var(--q);background:var(--panel);font-size:13px;cursor:grab;user-select:none}
.handle.picked{box-shadow:0 0 0 3px var(--q-soft)}
.thumbs{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}
.thumb .tl{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:4px}
.thumb .tl .dims{color:var(--faint)}
.thumb .mat{gap:1px}
.tape .tapecells{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;margin-bottom:8px}
.tape .tt{height:26px;border-radius:4px;background:var(--panel-3);font-family:var(--mono);font-size:9px;display:grid;place-items:center;color:var(--text)}
.tape .tapesum{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.6}
.klist{display:flex;flex-direction:column;gap:5px}
.krow{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:9px;border:1px solid var(--line-soft);background:var(--panel);flex-wrap:wrap}
.krow.covered{background:repeating-linear-gradient(135deg,var(--panel-3) 0 4px,var(--panel-2) 4px 8px);opacity:.6;padding:2px 8px;min-height:26px}
.krow.covered .strip,.krow.covered .ghosttag{display:none}
.krow.covered .under{font-size:11px;color:var(--faint);font-family:var(--mono)}
.krow.done{border-color:var(--k)}
.krow.raw{border-style:dashed;margin-top:8px}
.klab{font-family:var(--mono);font-size:12px;display:inline-flex;gap:8px;min-width:78px}
.klab .i{color:var(--faint);min-width:16px;text-align:right}
.klab .t{white-space:pre}
.ghosttag{opacity:.45;cursor:not-allowed}
.krow .score{font-family:var(--mono);font-size:12.5px;min-width:46px;text-align:right;color:var(--text);margin-left:auto;font-variant-numeric:tabular-nums}
.krow .amt{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
.zone.krow .strip.hot,.krow .strip.zone.hot{box-shadow:0 0 0 2.5px var(--accent);border-radius:6px}
.strip.zone.hot{box-shadow:0 0 0 2.5px var(--accent);border-radius:6px}
.strip.dragsrc{cursor:grab}
.thetarow{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.thetarow .tl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg.off button{opacity:.5;cursor:not-allowed}

/* -- softmax sliders (scene 7) -- */
.sliders{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:90px 1fr 46px 26px 52px;align-items:center;gap:10px;padding:4px 8px;border-radius:9px;border:1px solid var(--line-soft);background:var(--panel)}
.srow.locked{background:repeating-linear-gradient(135deg,var(--panel-3) 0 4px,var(--panel-2) 4px 8px);opacity:.75;cursor:not-allowed}
.srow.locked input{visibility:hidden}
.srow.handsoff{border-color:var(--bad);background:var(--bad-soft)}
.srow.handsoff input{accent-color:var(--bad)}
.srow .sv{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.srow .lamp{width:22px;height:22px;border-radius:6px;background:var(--mid);border:1px solid var(--line-soft);cursor:not-allowed}
.srow .lv{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.budget{margin:14px 0 6px}
.budget .bb{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--panel-3);gap:2px}
.budget .bb i{display:block;height:100%;font-style:normal;font-family:var(--mono);font-size:10px;overflow:hidden;white-space:nowrap;text-align:center;line-height:22px;transition:width .25s}
.budget .bl2{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
.budget .bl2.bad{color:var(--bad-ink)}
.card.guess{margin-top:12px}

/* -- blend (scene 8) -- */
.bowl .gauge2{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:8px 0}
.vecrowx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 0}
.vecrowx .lab2{font-family:var(--mono);font-size:12px;min-width:110px;color:var(--text)}
.vecrowx .lab2 small{color:var(--faint)}
.resid{margin-top:12px}
.zone.card.hot{box-shadow:0 0 0 2.5px var(--accent)}

/* -- bet (scene 9) -- */
.betzone{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--q);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--panel);font-size:13.5px}
.betzone .bt2 b{font-size:14px}
.hidden-until{opacity:.15;pointer-events:none;filter:blur(2px)}
.rail16{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:6px}
.r16{display:flex;flex-direction:column;align-items:center;font-family:var(--mono);border-radius:5px;padding:3px 0;border:1px solid var(--line-soft);background:var(--panel);font-size:11px;cursor:pointer}
.r16 .i{font-size:9px;color:var(--faint)}
.r16.ok{border-color:var(--good);color:var(--good-ink)}
.r16.no{border-color:var(--bad);color:var(--bad-ink)}
span.r16{cursor:default}

/* -- train (scene 10) -- */
.lossline{font-family:var(--mono);font-size:13px;margin-bottom:8px}
.lossline .ok{color:var(--good-ink)} .lossline .warn{color:var(--bad-ink)}
.dial{display:grid;grid-template-columns:1fr 60px;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:9px;border:1px solid var(--line-soft);margin-bottom:6px;background:var(--panel)}
.dial .dn{grid-column:1/3;font-size:13px}
.dial .dn b{font-family:var(--mono);font-weight:600}
.dial .dv{text-align:right;font-size:12px}

.stat .n{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.stats{display:flex;gap:22px;flex-wrap:wrap}

/* -- text picker -- */
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:6px}
.pick{
  text-align:left;border:1.5px solid var(--line);background:var(--panel-2);border-radius:14px;padding:14px 16px;cursor:pointer;
  transition:all .15s;display:flex;flex-direction:column;gap:6px;min-height:150px;
}
.pick:hover{border-color:var(--accent);transform:translateY(-1px)}
.pick.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.pick .ttl{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.15;color:var(--text)}
.pick .by{font-size:12px;color:var(--faint)}
.pick .ex{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);line-height:1.4;white-space:pre-line;flex:1}
.pick .meta{font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;gap:12px}
textarea.own{
  width:100%;min-height:120px;font:inherit;font-family:var(--serif);font-size:16px;line-height:1.5;border:1.5px solid var(--line);
  border-radius:12px;padding:12px 14px;background:var(--panel);color:var(--text);resize:vertical;
}
textarea.own:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

/* -- range inputs -- */
input[type=range]{accent-color:var(--accent);width:100%}
.range{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.range b{font-family:var(--mono);color:var(--text);font-weight:500;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}

/* -- attention arcs over a token strip -- */
.arcs{position:relative}
.arcs svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.arcs path{fill:none;stroke:var(--ink-hi);stroke-linecap:round}

/* -- recap list (finale) -- */
.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.recap li{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.recap .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.recap .v{color:var(--text)}

/* -- misc -- */
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);background:var(--panel)}
.pill.on{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--panel);padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--bg)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.rowflex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{height:14px}
.fade{animation:fadein .4s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-ring)}50%{box-shadow:0 0 0 6px transparent}}

@media (max-width:860px){
  #app{flex-direction:column}
  #rail{width:auto;flex:none;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto;padding:12px 14px;gap:14px;border-right:none;border-bottom:1px solid var(--line-soft)}
  #brand .sub,#brand .home{display:none}
  #brand .word{font-size:20px}
  #steps{flex-direction:row;align-items:center}
  #steps .grp{display:none}
  #steps li.step button{padding:6px}
  #steps li.step button .lbl{display:none}
  #modelcard,#railfoot{display:none}
  #scenewrap{padding:22px 16px 70px}
  #stage{padding:16px}
  .cols,.cols.w2,.cols.w3{grid-template-columns:1fr}
  .mat{--cell:18px}
  .recap li{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

<body>
<div id="app">
  <aside id="rail">
    <div id="brand">
      <a class="home" href="https://drdoubleb.com">← drdoubleb.com</a>
      <div class="word">Look <i>Back</i></div>
      <div class="sub">Attention · hands on</div>
    </div>
    <div id="modelcard" hidden></div>
    <ol id="steps"></ol>
    <div id="railfoot">Drag things where they belong — or click one, then click its destination. Wrong moves explain themselves.</div>
  </aside>
  <main id="main">
    <div id="scenewrap">
      <header id="scenehead">
        <div class="eyebrow"></div>
        <h1></h1>
        <p class="lede"></p>
      </header>
      <div id="coach"><span class="pin"></span><span id="coachtext"></span></div>
      <section id="stage" aria-live="polite"></section>
      <div id="readout" class="mono" hidden></div>
      <div id="nav">
        <button class="btn" id="backBtn">Back</button>
        <button class="btn" id="resetBtn" title="Restart this step from scratch">↺ Reset step</button>
        <button class="btn primary" id="nextBtn">Next step</button>
      </div>
    </div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script id="model-core">
/* =====================================================================
 *  A tiny transformer language model in plain JavaScript.
 *
 *  This is a line-by-line port of attention_model/model.py, tokenizer
 *  (word-level instead of BPE) and training.py from the NumPy repo.
 *  Nothing is hidden behind a framework: the forward pass, every
 *  gradient, and the optimizer are written out by hand so that any
 *  intermediate number can be shown on screen.
 *
 *  Architecture (one transformer block, single attention head):
 *
 *      ids                  token ids, length T
 *      x0 = E[ids] + P      token embedding + positional embedding   (T, D)
 *      Q, K, V = x0 Wq, x0 Wk, x0 Wv                                 (T, D)
 *      S = Q K^T / sqrt(D)  attention scores, causally masked        (T, T)
 *      A = softmax(S)       attention weights                        (T, T)
 *      C = A V              each row is a blend of value vectors     (T, D)
 *      x1 = x0 + C Wo       attended information added back          (T, D)
 *      x2 = x1 + relu(x1 W1) W2      feed-forward layer              (T, D)
 *      logits = x2 Wout     one score per vocabulary token           (T, V)
 *
 *  The model is trained to predict the *next* token at every position
 *  with cross-entropy loss.  No layer norm, no multi-head, no dropout:
 *  at this scale training is stable without them and the math stays
 *  readable.
 *
 *  Conventions: every matrix is a plain Array of plain Array rows of
 *  numbers (M[i][j]).  Plain arrays, not Float64Array: V8 stores them as
 *  packed doubles anyway, and allocating a typed array costs ~40x more
 *  than a plain one, which made a training step 15x slower.  Nothing
 *  here uses ES modules, the DOM, or Node APIs — paste the whole file
 *  inside a <script> tag.
 * ===================================================================== */

/* ------------------------------------------------------------------ */
/*  Random numbers                                                     */
/* ------------------------------------------------------------------ */

/** Seeded 32-bit PRNG.  Returns a function that yields floats in [0, 1).
 *  Same seed => same sequence, in every browser, forever. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** One sample from the standard normal distribution (Box–Muller). */
function randn(rng) {
  let u = 0;
  while (u === 0) u = rng();           // avoid log(0)
  const v = rng();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

/** Uniform integer in [0, n). */
function randInt(rng, n) {
  return Math.floor(rng() * n);
}

/* ------------------------------------------------------------------ */
/*  Little linear-algebra toolkit (matrices = Array of Array rows)     */
/* ------------------------------------------------------------------ */

/** A row of `n` zeros (a packed double array in V8). */
function zeroRow(n) {
  const r = [];
  for (let j = 0; j < n; j++) r.push(0.0);
  return r;
}

function zeros(rows, cols) {
  const M = new Array(rows);
  for (let i = 0; i < rows; i++) M[i] = zeroRow(cols);
  return M;
}

function zerosLike(M) {
  return zeros(M.length, M[0].length);
}

/** rows x cols matrix of N(0, std^2) samples. */
function randnMat(rows, cols, std, rng) {
  const M = zeros(rows, cols);
  for (let i = 0; i < rows; i++)
    for (let j = 0; j < cols; j++) M[i][j] = randn(rng) * std;
  return M;
}

function copyMat(M) {
  return M.map((row) => row.slice());
}

function transpose(M) {
  const rows = M.length, cols = M[0].length;
  const T = zeros(cols, rows);
  for (let i = 0; i < rows; i++)
    for (let j = 0; j < cols; j++) T[j][i] = M[i][j];
  return T;
}

/** C = A · B      (n×k)·(k×m) -> (n×m) */
function matmul(A, B) {
  const n = A.length, k = B.length, m = B[0].length;
  const C = zeros(n, m);
  for (let i = 0; i < n; i++) {
    const Ai = A[i], Ci = C[i];
    for (let p = 0; p < k; p++) {
      const a = Ai[p];
      if (a === 0) continue;
      const Bp = B[p];
      for (let j = 0; j < m; j++) Ci[j] += a * Bp[j];
    }
  }
  return C;
}

/** C = A · Bᵀ     (n×k)·(m×k)ᵀ -> (n×m)   (avoids building Bᵀ) */
function matmulBT(A, B) {
  const n = A.length, m = B.length, k = B[0].length;
  const C = zeros(n, m);
  for (let i = 0; i < n; i++) {
    const Ai = A[i], Ci = C[i];
    for (let j = 0; j < m; j++) {
      const Bj = B[j];
      let s = 0;
      for (let p = 0; p < k; p++) s += Ai[p] * Bj[p];
      Ci[j] = s;
    }
  }
  return C;
}

/** C = Aᵀ · B     (k×n)ᵀ·(k×m) -> (n×m)   (avoids building Aᵀ) */
function matmulAT(A, B) {
  const k = A.length, n = A[0].length, m = B[0].length;
  const C = zeros(n, m);
  for (let p = 0; p < k; p++) {
    const Ap = A[p], Bp = B[p];
    for (let i = 0; i < n; i++) {
      const a = Ap[i];
      if (a === 0) continue;
      const Ci = C[i];
      for (let j = 0; j < m; j++) Ci[j] += a * Bp[j];
    }
  }
  return C;
}

function addMat(A, B) {
  const C = zerosLike(A);
  for (let i = 0; i < A.length; i++)
    for (let j = 0; j < A[0].length; j++) C[i][j] = A[i][j] + B[i][j];
  return C;
}

/** A += B, in place. */
function addInPlace(A, B) {
  for (let i = 0; i < A.length; i++)
    for (let j = 0; j < A[0].length; j++) A[i][j] += B[i][j];
  return A;
}

function scaleMat(A, s) {
  const C = zerosLike(A);
  for (let i = 0; i < A.length; i++)
    for (let j = 0; j < A[0].length; j++) C[i][j] = A[i][j] * s;
  return C;
}

/** Row-wise softmax; subtracts the row max first for numerical safety. */
function softmaxRows(M) {
  const out = zerosLike(M);
  for (let i = 0; i < M.length; i++) {
    const row = M[i], o = out[i];
    let mx = -Infinity;
    for (let j = 0; j < row.length; j++) if (row[j] > mx) mx = row[j];
    let sum = 0;
    for (let j = 0; j < row.length; j++) { o[j] = Math.exp(row[j] - mx); sum += o[j]; }
    for (let j = 0; j < row.length; j++) o[j] /= sum;
  }
  return out;
}

/** Softmax of a single vector. */
function softmaxVec(v) {
  const out = zeroRow(v.length);
  let mx = -Infinity;
  for (let j = 0; j < v.length; j++) if (v[j] > mx) mx = v[j];
  let sum = 0;
  for (let j = 0; j < v.length; j++) { out[j] = Math.exp(v[j] - mx); sum += out[j]; }
  for (let j = 0; j < v.length; j++) out[j] /= sum;
  return out;
}

function argmax(v) {
  let best = 0;
  for (let j = 1; j < v.length; j++) if (v[j] > v[best]) best = j;
  return best;
}

/* ------------------------------------------------------------------ */
/*  Word-level tokenizer                                               */
/* ------------------------------------------------------------------ */

/**
 * Splits text into word tokens, punctuation tokens and line-break tokens.
 *
 *   - everything is lower-cased; curly quotes and dashes are normalized
 *   - a word is [a-z0-9]+ with internal apostrophes kept ("don't")
 *   - each of  . , ; : ! ? " ' ( ) - —  is its own token
 *   - each newline is the token "\n" (leading/trailing newlines dropped)
 *   - anything else (tabs, emoji, stray symbols) is ignored
 *
 * Token ids are assigned by descending frequency (ties alphabetical),
 * so id 0 is always the most common token in the training text.
 */
class WordTokenizer {
  constructor(text) {
    const tokens = WordTokenizer.tokenize(text);

    // Count every token, then sort: most frequent first, ties A→Z.
    const counts = new Map();
    for (const t of tokens) counts.set(t, (counts.get(t) || 0) + 1);
    const entries = Array.from(counts.entries());
    entries.sort((a, b) => (b[1] - a[1]) || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));

    this.vocab = entries.map((e) => e[0]);     // id -> token string
    this.counts = entries.map((e) => e[1]);    // id -> frequency in training text
    this.tokenToId = new Map(this.vocab.map((t, i) => [t, i]));
    this.trainingTokens = tokens;              // the corpus as token strings
  }

  /** Normalize typography so the same word always becomes the same token. */
  static normalize(text) {
    return text
      .replace(/\r\n?/g, "\n")
      .replace(/[‘’‚‛′]/g, "'")   // ‘ ’ ‚ ‛ ′
      .replace(/[“”„‟″]/g, '"')   // “ ” „ ‟ ″
      .replace(/–|—|―|--+/g, "—")       // – — ― -- -> —
      .replace(/…/g, "...")                            // … -> ...
      .toLowerCase();
  }

  /** Text -> array of token strings (does not need a vocabulary). */
  static tokenize(text) {
    const norm = WordTokenizer.normalize(text);
    const re = /[a-z0-9]+(?:'[a-z0-9]+)*|[.,;:!?"'()\-—]|\n/g;
    const tokens = norm.match(re) || [];
    // Drop leading and trailing line breaks (but keep interior ones, one per newline).
    let start = 0, end = tokens.length;
    while (start < end && tokens[start] === "\n") start++;
    while (end > start && tokens[end - 1] === "\n") end--;
    return tokens.slice(start, end);
  }

  tokenize(text) {
    return WordTokenizer.tokenize(text);
  }

  get vocabSize() {
    return this.vocab.length;
  }

  /** Token string -> id, or -1 if it is not in the vocabulary. */
  idOf(token) {
    const id = this.tokenToId.get(token);
    return id === undefined ? -1 : id;
  }

  /** Text -> ids.  Words the vocabulary has never seen are silently skipped
   *  (use encodeReport to find out which ones). */
  encode(text) {
    return this.encodeReport(text).ids;
  }

  /** Text -> { ids, tokens, unknown } where unknown lists skipped words. */
  encodeReport(text) {
    const tokens = this.tokenize(text);
    const ids = [], unknown = [];
    for (const t of tokens) {
      const id = this.tokenToId.get(t);
      if (id === undefined) unknown.push(t);
      else ids.push(id);
    }
    return { ids, tokens, unknown };
  }

  /** Ids -> readable text, re-inserting spaces where a reader expects them. */
  decode(ids) {
    return WordTokenizer.join(ids.map((i) => this.vocab[i]));
  }

  /** Token strings -> text.  Rules: no space before . , ; : ! ? ) or a
   *  closing quote; no space after ( or an opening quote; "\n" is a real
   *  line break with no spaces around it; hyphen and em-dash glue to
   *  their neighbours ("well-known", "times—it"). */
  static join(tokens) {
    const noSpaceBefore = new Set([".", ",", ";", ":", "!", "?", ")", "-", "—"]);
    const noSpaceAfter = new Set(["(", "-", "—"]);
    let out = "";
    let prev = null;             // previous token, null at start / after newline
    let dquoteOpen = false, squoteOpen = false;
    for (const t of tokens) {
      if (t === undefined) continue;
      if (t === "\n") { out += "\n"; prev = null; continue; }

      let glue = prev !== null;                      // default: put a space
      if (glue && noSpaceBefore.has(t)) glue = false;
      if (glue && noSpaceAfter.has(prev)) glue = false;
      if (t === '"') { if (dquoteOpen) glue = false; }
      if (t === "'") { if (squoteOpen) glue = false; }
      if (glue && prev === '"' && dquoteOpen) glue = false;   // just opened a quote
      if (glue && prev === "'" && squoteOpen) glue = false;

      out += (glue ? " " : "") + t;
      if (t === '"') dquoteOpen = !dquoteOpen;
      if (t === "'") squoteOpen = !squoteOpen;
      prev = t;
    }
    return out;
  }
}

/* ------------------------------------------------------------------ */
/*  The model                                                          */
/* ------------------------------------------------------------------ */

class TinyTransformer {
  constructor({ vocabSize, dModel = 16, context = 16, mlpHidden = 32, seed = 42, initStd = 0.08 } = {}) {
    if (!vocabSize) throw new Error("TinyTransformer needs vocabSize");
    this.vocabSize = vocabSize;
    this.dModel = dModel;
    this.context = context;
    this.mlpHidden = mlpHidden;
    this.seed = seed;
    this.initStd = initStd;
    this.causal = true;      // false = the "cheating" twin: positions may look at the future

    const rng = mulberry32(seed);
    const init = (r, c) => randnMat(r, c, initStd, rng);

    this.params = {
      E: init(vocabSize, dModel),      // token embeddings
      P: init(context, dModel),        // positional embeddings
      Wq: init(dModel, dModel),        // query projection
      Wk: init(dModel, dModel),        // key projection
      Wv: init(dModel, dModel),        // value projection
      Wo: init(dModel, dModel),        // attention output projection
      W1: init(dModel, mlpHidden),     // feed-forward in
      W2: init(mlpHidden, dModel),     // feed-forward out
      Wout: init(dModel, vocabSize),   // final projection to logits
    };

    // Adam optimizer state: one pair of moment tensors per parameter.
    this.adamM = {};
    this.adamV = {};
    for (const k in this.params) {
      this.adamM[k] = zerosLike(this.params[k]);
      this.adamV[k] = zerosLike(this.params[k]);
    }
    this.adamT = 0;
    this.stepsTrained = 0;   // bookkeeping for the UI (not used by the math)
  }

  static get PARAM_NAMES() {
    return ["E", "P", "Wq", "Wk", "Wv", "Wo", "W1", "W2", "Wout"];
  }

  paramCount() {
    let n = 0;
    for (const k in this.params) n += this.params[k].length * this.params[k][0].length;
    return n;
  }

  /* ----------------------------------------------------------- forward */

  /**
   * Run the model on an array of token ids (length T <= context).
   * Returns a cache holding *every* intermediate value; the UI draws
   * from it directly and backward() consumes the same cache.
   */
  forward(ids) {
    const T = ids.length;
    if (T === 0) throw new Error("forward() needs at least one token");
    if (T > this.context) throw new Error("sequence longer than the model's context");
    const p = this.params;
    const D = this.dModel;
    const scale = 1.0 / Math.sqrt(D);

    // --- embeddings: look up each token's vector, add its position's vector
    const xTok = zeros(T, D), xPos = zeros(T, D), x0 = zeros(T, D);
    for (let t = 0; t < T; t++) {
      const e = p.E[ids[t]], pos = p.P[t];
      if (!e) throw new Error("token id out of range: " + ids[t]);
      for (let j = 0; j < D; j++) {
        xTok[t][j] = e[j];
        xPos[t][j] = pos[j];
        x0[t][j] = e[j] + pos[j];
      }
    }

    // --- attention: queries, keys, values
    const Q = matmul(x0, p.Wq);
    const K = matmul(x0, p.Wk);
    const V = matmul(x0, p.Wv);

    // S[i][j] = how much position i "matches" position j
    const S = scaleMat(matmulBT(Q, K), scale);

    // Causal mask: a position may only look at itself and the past.
    // Future entries are set to -1e9 BEFORE softmax, exactly as in NumPy,
    // so the masked matrix can be displayed.
    const Smasked = copyMat(S);
    if (this.causal !== false)
      for (let i = 0; i < T; i++)
        for (let j = i + 1; j < T; j++) Smasked[i][j] = -1e9;
    const A = softmaxRows(Smasked);          // rows sum to 1

    const C = matmul(A, V);                  // weighted blend of value vectors
    const attnOut = matmul(C, p.Wo);
    const x1 = addMat(x0, attnOut);          // residual connection

    // --- feed-forward
    const pre = matmul(x1, p.W1);
    const h = zerosLike(pre);                // ReLU
    for (let i = 0; i < T; i++)
      for (let j = 0; j < this.mlpHidden; j++) h[i][j] = pre[i][j] > 0 ? pre[i][j] : 0;
    const mlpOut = matmul(h, p.W2);
    const x2 = addMat(x1, mlpOut);           // residual connection

    // --- output
    const logits = matmul(x2, p.Wout);
    const probs = softmaxRows(logits);

    return {
      ids: Array.from(ids), T, xTok, xPos, x0,
      Q, K, V, S, Smasked, A,
      C, attnOut, x1, pre, h, mlpOut, x2, logits, probs,
    };
  }

  /** Mean cross-entropy of predicting `targets` (the next tokens). */
  loss(cache, targets) {
    const T = cache.T;
    let total = 0;
    for (let t = 0; t < T; t++) total += -Math.log(cache.probs[t][targets[t]] + 1e-12);
    return total / T;
  }

  /* ---------------------------------------------------------- backward */

  /** Hand-derived gradients of the loss w.r.t. every parameter. */
  backward(cache, targets) {
    const p = this.params;
    const { ids, T } = cache;
    const D = this.dModel;
    const scale = 1.0 / Math.sqrt(D);
    const g = {};

    // Softmax + cross-entropy together give the famous (probs - onehot) / T.
    const dlogits = copyMat(cache.probs);
    for (let t = 0; t < T; t++) {
      dlogits[t][targets[t]] -= 1.0;
      for (let j = 0; j < this.vocabSize; j++) dlogits[t][j] /= T;
    }

    g.Wout = matmulAT(cache.x2, dlogits);
    const dx2 = matmulBT(dlogits, p.Wout);

    // Feed-forward block (x2 = x1 + relu(x1 W1) W2).
    const dmlpOut = dx2;
    const dx1 = copyMat(dx2);                          // residual branch
    g.W2 = matmulAT(cache.h, dmlpOut);
    const dh = matmulBT(dmlpOut, p.W2);
    const dpre = zerosLike(dh);                        // ReLU gate
    for (let i = 0; i < T; i++)
      for (let j = 0; j < this.mlpHidden; j++) dpre[i][j] = cache.pre[i][j] > 0 ? dh[i][j] : 0;
    g.W1 = matmulAT(cache.x1, dpre);
    addInPlace(dx1, matmulBT(dpre, p.W1));

    // Attention block (x1 = x0 + (A V) Wo).
    const dattnOut = dx1;
    const dx0 = copyMat(dx1);                          // residual branch
    g.Wo = matmulAT(cache.C, dattnOut);
    const dC = matmulBT(dattnOut, p.Wo);

    const dA = matmulBT(dC, cache.V);
    const dV = matmulAT(cache.A, dC);

    // Softmax backward, row by row: dS = A * (dA - sum(dA * A)).
    // (Masked entries have A = 0, so their dS is 0 automatically.)
    const A = cache.A;
    const dS = zeros(T, T);
    for (let i = 0; i < T; i++) {
      let dot = 0;
      for (let j = 0; j < T; j++) dot += dA[i][j] * A[i][j];
      for (let j = 0; j < T; j++) dS[i][j] = A[i][j] * (dA[i][j] - dot);
    }

    const dQ = scaleMat(matmul(dS, cache.K), scale);
    const dK = scaleMat(matmulAT(dS, cache.Q), scale);

    const x0 = cache.x0;
    g.Wq = matmulAT(x0, dQ);
    g.Wk = matmulAT(x0, dK);
    g.Wv = matmulAT(x0, dV);
    addInPlace(dx0, matmulBT(dQ, p.Wq));
    addInPlace(dx0, matmulBT(dK, p.Wk));
    addInPlace(dx0, matmulBT(dV, p.Wv));

    // Embeddings: scatter-add each position's gradient onto its token row.
    g.E = zerosLike(p.E);
    g.P = zerosLike(p.P);
    for (let t = 0; t < T; t++) {
      const gE = g.E[ids[t]], gP = g.P[t], d = dx0[t];
      for (let j = 0; j < D; j++) { gE[j] += d[j]; gP[j] = d[j]; }
    }

    return g;
  }

  /* --------------------------------------------------------- optimizer */

  /** One Adam update: momentum + per-parameter adaptive step size. */
  adamStep(grads, lr, beta1 = 0.9, beta2 = 0.999, eps = 1e-8) {
    this.adamT += 1;
    const t = this.adamT;
    const c1 = 1 - Math.pow(beta1, t);   // bias corrections
    const c2 = 1 - Math.pow(beta2, t);
    for (const k in grads) {
      const P = this.params[k], G = grads[k], M = this.adamM[k], Vv = this.adamV[k];
      for (let i = 0; i < P.length; i++) {
        const Pi = P[i], Gi = G[i], Mi = M[i], Vi = Vv[i];
        for (let j = 0; j < Pi.length; j++) {
          const gr = Gi[j];
          Mi[j] = beta1 * Mi[j] + (1 - beta1) * gr;
          Vi[j] = beta2 * Vi[j] + (1 - beta2) * gr * gr;
          const mHat = Mi[j] / c1;
          const vHat = Vi[j] / c2;
          Pi[j] -= lr * mHat / (Math.sqrt(vHat) + eps);
        }
      }
    }
    this.stepsTrained += 1;
  }

  /* -------------------------------------------------------- generation */

  /** Probabilities for the token that follows `ids` (uses the last
   *  `context` ids).  Returns { probs, cache }. */
  nextTokenDistribution(ids) {
    const ctx = ids.length > this.context ? ids.slice(ids.length - this.context) : ids;
    const cache = this.forward(ctx);
    return { probs: cache.probs[cache.T - 1], cache };
  }

  /**
   * Autoregressive sampling.  temperature 0 = greedy (argmax).
   * Returns { ids, steps } where each step records the context that was
   * fed in, the (temperature-adjusted) probabilities, the attention
   * matrix, and the chosen id — everything the UI needs to replay it.
   */
  generate(ids, numTokens, { temperature = 1.0, rng = null, topK = 0 } = {}) {
    rng = rng || mulberry32(0);
    ids = Array.from(ids);
    const steps = [];
    for (let n = 0; n < numTokens; n++) {
      const { probs, cache } = this.nextTokenDistribution(ids);
      const pick = sampleFrom(probs, temperature, rng, topK);
      steps.push({
        contextIds: cache.ids.slice(),
        probs: pick.probs,           // what was actually sampled from
        rawProbs: probs,             // the model's own distribution
        attention: cache.A,
        chosen: pick.id,
      });
      ids.push(pick.id);
    }
    return { ids, steps };
  }

  /* --------------------------------------------- save / load / clone */

  /** Plain-object snapshot (JSON-friendly) of config and weights.  With
   *  includeOptimizer (default true) the Adam moments are saved too, so
   *  training can resume bit-identically; without them the snapshot is
   *  ~1/3 the size and still generates identically. */
  serialize({ includeOptimizer = true } = {}) {
    const toArrays = (M) => M.map((row) => row.slice());
    const out = {
      format: "tiny-transformer-v1",
      vocabSize: this.vocabSize, dModel: this.dModel, context: this.context,
      mlpHidden: this.mlpHidden, seed: this.seed, initStd: this.initStd,
      adamT: this.adamT, stepsTrained: this.stepsTrained, causal: this.causal,
      params: {},
    };
    for (const k in this.params) out.params[k] = toArrays(this.params[k]);
    if (includeOptimizer) {
      out.adamM = {}; out.adamV = {};
      for (const k in this.params) {
        out.adamM[k] = toArrays(this.adamM[k]);
        out.adamV[k] = toArrays(this.adamV[k]);
      }
    }
    return out;
  }

  /** Rebuild a model from serialize() output (or its JSON string). */
  static deserialize(obj) {
    if (typeof obj === "string") obj = JSON.parse(obj);
    const m = new TinyTransformer({
      vocabSize: obj.vocabSize, dModel: obj.dModel, context: obj.context,
      mlpHidden: obj.mlpHidden, seed: obj.seed, initStd: obj.initStd,
    });
    const fromArrays = (rows) => rows.map((row) => row.map(Number));
    for (const k in m.params) {
      m.params[k] = fromArrays(obj.params[k]);
      if (obj.adamM && obj.adamM[k]) m.adamM[k] = fromArrays(obj.adamM[k]);
      if (obj.adamV && obj.adamV[k]) m.adamV[k] = fromArrays(obj.adamV[k]);
    }
    m.adamT = obj.adamT || 0;
    m.stepsTrained = obj.stepsTrained || 0;
    if (obj.causal === false) m.causal = false;
    return m;
  }

  /** Deep copy (weights and optimizer state). */
  clone() {
    return TinyTransformer.deserialize(this.serialize());
  }
}

/* ------------------------------------------------------------------ */
/*  Sampling helper (standalone so the UI can sample one token)        */
/* ------------------------------------------------------------------ */

/**
 * Pick one id from a probability vector.
 *   temperature <= 0 -> argmax (greedy); the returned probs are the input.
 *   otherwise        -> probs are re-sharpened: softmax(log(p)/temperature),
 *                       optionally restricted to the topK most likely ids,
 *                       then one id is drawn with rng().
 * Returns { id, probs } where probs is the distribution actually sampled.
 */
function sampleFrom(probs, temperature = 1.0, rng = null, topK = 0) {
  if (temperature <= 0) return { id: argmax(probs), probs: probs.slice() };
  rng = rng || Math.random;
  const logits = zeroRow(probs.length);
  for (let j = 0; j < probs.length; j++) logits[j] = Math.log(probs[j] + 1e-12) / temperature;
  let sp = softmaxVec(logits);
  if (topK > 0 && topK < sp.length) {
    const order = Array.from(sp.keys()).sort((a, b) => sp[b] - sp[a]);
    const keep = new Set(order.slice(0, topK));
    let sum = 0;
    for (let j = 0; j < sp.length; j++) { if (!keep.has(j)) sp[j] = 0; sum += sp[j]; }
    for (let j = 0; j < sp.length; j++) sp[j] /= sum;
  }
  // Inverse-CDF draw.
  const r = rng();
  let acc = 0, id = sp.length - 1;
  for (let j = 0; j < sp.length; j++) {
    acc += sp[j];
    if (r < acc) { id = j; break; }
  }
  return { id, probs: sp };
}

/* ------------------------------------------------------------------ */
/*  Training                                                           */
/* ------------------------------------------------------------------ */

/**
 * Sample `batchSize` random (input, target) windows from the token stream.
 * Targets are the inputs shifted one to the left: at every position the
 * model learns to predict what comes next.
 */
function makeBatches(tokenIds, context, batchSize, rng) {
  const maxStart = tokenIds.length - context - 1;
  if (maxStart < 0) throw new Error("training text is shorter than context + 1 tokens");
  const xs = [], ys = [];
  for (let b = 0; b < batchSize; b++) {
    const s = randInt(rng, maxStart + 1);
    xs.push(tokenIds.slice(s, s + context));
    ys.push(tokenIds.slice(s + 1, s + context + 1));
  }
  return { xs, ys };
}

/**
 * One optimizer step: sample a batch, accumulate loss and gradients over
 * it, average, apply Adam.  Returns { loss } (the mean batch loss, i.e.
 * the number the training curve is drawn from).
 */
function trainStep(model, tokenIds, { context = model.context, batchSize = 8, lr = 3e-3, rng } = {}) {
  if (!rng) throw new Error("trainStep needs an rng (e.g. mulberry32(seed)) to stay deterministic");
  const { xs, ys } = makeBatches(tokenIds, context, batchSize, rng);
  let batchLoss = 0;
  let grads = null;
  for (let b = 0; b < xs.length; b++) {
    const cache = model.forward(xs[b]);
    batchLoss += model.loss(cache, ys[b]);
    const g = model.backward(cache, ys[b]);
    if (grads === null) grads = g;
    else for (const k in grads) addInPlace(grads[k], g[k]);
  }
  batchLoss /= xs.length;
  for (const k in grads) {
    const G = grads[k];
    for (let i = 0; i < G.length; i++)
      for (let j = 0; j < G[i].length; j++) G[i][j] /= xs.length;
  }
  model.adamStep(grads, lr);
  return { loss: batchLoss, grads };
}

/**
 * Average next-token loss over the *whole* corpus, walking it in
 * non-overlapping windows of `context` tokens.  Deterministic, so it makes
 * a much smoother curve than the noisy per-batch loss.
 */
function corpusLoss(model, tokenIds, context = model.context) {
  let total = 0, count = 0;
  for (let s = 0; s + 1 < tokenIds.length; s += context) {
    const len = Math.min(context, tokenIds.length - 1 - s);
    const x = tokenIds.slice(s, s + len);
    const y = tokenIds.slice(s + 1, s + 1 + len);
    const cache = model.forward(x);
    total += model.loss(cache, y) * len;
    count += len;
  }
  return count ? total / count : NaN;
}

/**
 * Run a probe sequence through the model and summarize what it predicts
 * at every position.  Returns { cache, positions } where positions[t] =
 * { inputId, probs, top: [{id, p}, ...] } (top `k` predictions).
 */
function probeSequence(model, ids, k = 5) {
  const cache = model.forward(ids);
  const positions = [];
  for (let t = 0; t < cache.T; t++) {
    const probs = cache.probs[t];
    const order = Array.from(probs.keys()).sort((a, b) => probs[b] - probs[a]);
    positions.push({
      inputId: ids[t],
      probs,
      top: order.slice(0, k).map((id) => ({ id, p: probs[id] })),
    });
  }
  return { cache, positions };
}

/* ------------------------------------------------------------------ */
/*  Node-only export so the tests can require() this file.             */
/* ------------------------------------------------------------------ */
if (typeof module !== "undefined") {
  module.exports = {
    mulberry32, randn, randInt,
    zeroRow, zeros, zerosLike, randnMat, copyMat, transpose, matmul, matmulBT, matmulAT,
    addMat, addInPlace, scaleMat, softmaxRows, softmaxVec, argmax,
    WordTokenizer, TinyTransformer, sampleFrom,
    makeBatches, trainStep, corpusLoss, probeSequence,
  };
}

<script>
"use strict";
/* ============================ tiny helpers ============================ */
const $=(s,p=document)=>p.querySelector(s);
function el(tag,cls,html){const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n;}
function svgEl(tag,attrs){const n=document.createElementNS("http://www.w3.org/2000/svg",tag);if(attrs)for(const k in attrs)n.setAttribute(k,attrs[k]);return n;}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=(x,d=2)=>(x<0?"−":"")+Math.abs(x).toFixed(d);          // typographic minus
const pct=(p,d=0)=>(p*100).toFixed(d)+"%";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const showTok=t=>t==="\n"?"↵":t;                                    // the line-break token gets a visible glyph
const REDUCED=matchMedia("(prefers-reduced-motion:reduce)").matches;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?0:ms));
function argmax(a){let b=0;for(let i=1;i<a.length;i++)if(a[i]>a[b])b=i;return b;}
function topK(a,k){return [...a.keys()].sort((i,j)=>a[j]-a[i]).slice(0,k);}

/* ============================ toast & coach ============================ */
let toastT=null;
function toast(msg,kind){
  const t=$("#toast");t.innerHTML=msg;t.className="show"+(kind?" "+kind:"");
  clearTimeout(toastT);toastT=setTimeout(()=>t.className="",kind==="bad"?8500:6500);
}
function coach(msg,win){
  $("#coachtext").innerHTML=msg;
  $("#coach").className=win?"win":"";
}

/* ============================ drag & drop engine ============================
   Pointer-based drag with a floating ghost, plus a click-to-pick fallback:
   click a chip to pick it up, click a highlighted zone to place it.
   Zones return true (accepted), a string (rejected — shown as a toast that
   explains WHY), or false (rejected silently).                             */
let zones=[];      // {el, handler(payload, chipEl) -> true | "why not" | false, pad}
let picked=null;   // chip picked via click
function registerZone(zel,handler,pad){
  zel.classList.add("zone");zones.push({el:zel,handler,pad:pad||0});
  zel.addEventListener("click",()=>{if(picked&&picked.el!==zel){const p=picked;attemptDrop(zel,p.payload,p.el);} });
  if(!zel.hasAttribute("tabindex"))zel.setAttribute("tabindex","0");
  zel.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();zel.click();}});
}
function unregisterZone(zel){zones=zones.filter(z=>z.el!==zel);zel.classList.remove("zone","hot");}
function clearScene(){zones=[];picked=null;}
function zoneAt(x,y){
  for(const z of zones){
    if(!document.body.contains(z.el))continue;
    const r=z.el.getBoundingClientRect(),p=z.pad;
    if(x>=r.left-p&&x<=r.right+p&&y>=r.top-p&&y<=r.bottom+p)return z;
  }
  return null;
}
/* On touch the ghost floats above the finger, so accept a hit at either point;
   when they disagree prefer the smaller (more specific) target. */
function zoneAtDrag(e,exclude){
  const pick=(x,y)=>{const z=zoneAt(x,y);return z&&z.el!==exclude?z:null;};
  const a=pick(e.clientX,e.clientY);
  if(e.pointerType!=="touch")return a;
  const b=pick(e.clientX,e.clientY-56);
  if(!a)return b;
  if(!b||b===a)return a;
  const area=z=>{const r=z.el.getBoundingClientRect();return r.width*r.height;};
  return area(b)<area(a)?b:a;
}
function attemptDrop(zel,payload,chipEl){
  const z=zones.find(z=>z.el===zel);if(!z)return;
  unpick();
  const res=z.handler(payload,chipEl);
  if(res===true)return;
  zel.classList.remove("deny");void zel.offsetWidth;zel.classList.add("deny");
  if(typeof res==="string")toast(res,"bad");
}
function unpick(){if(picked){picked.el.classList.remove("picked");picked=null;}}
document.addEventListener("click",e=>{
  if(picked&&!e.target.closest(".chip")&&!e.target.closest(".zone")&&!e.target.closest(".dragsrc"))unpick();
},true);

function makeChip(opts){
  // opts: {label, sub, glyph(html), payload, cls, ghostHtml}
  const c=el("button","chip"+(opts.cls?" "+opts.cls:""));
  c.type="button";
  if(opts.glyph)c.append(el("span","glyph",opts.glyph));
  const tx=el("span","",`<span>${opts.label}</span>`+(opts.sub?`<small>${opts.sub}</small>`:""));
  c.append(tx);
  c.payload=opts.payload;
  let start=null,ghost=null,draggingStarted=false;
  c.addEventListener("pointerdown",e=>{
    if(c.classList.contains("spent"))return;
    start={x:e.clientX,y:e.clientY,id:e.pointerId};draggingStarted=false;
    c.setPointerCapture(e.pointerId);
  });
  c.addEventListener("pointermove",e=>{
    if(!start||e.pointerId!==start.id)return;
    const dx=e.clientX-start.x,dy=e.clientY-start.y;
    if(!draggingStarted&&Math.hypot(dx,dy)>7){
      draggingStarted=true;unpick();
      if(opts.ghostHtml){ghost=el("div","ghostmini",opts.ghostHtml);}
      else{ghost=c.cloneNode(true);ghost.classList.add("ghost");ghost.classList.remove("picked");}
      document.body.appendChild(ghost);c.classList.add("dragging");
    }
    if(draggingStarted){
      ghost.style.left=e.clientX+"px";
      ghost.style.top=(e.pointerType==="touch"?e.clientY-56:e.clientY)+"px";
      const z=zoneAtDrag(e);
      zones.forEach(zz=>zz.el.classList.toggle("hot",zz===z));
    }
  });
  const finish=e=>{
    if(!start||e.pointerId!==start.id)return;
    zones.forEach(zz=>zz.el.classList.remove("hot"));
    if(draggingStarted){
      const z=zoneAtDrag(e);
      ghost.remove();ghost=null;c.classList.remove("dragging");
      if(z)attemptDrop(z.el,c.payload,c);
    }else{
      if(picked&&picked.el===c){unpick();}
      else{unpick();picked={el:c,payload:c.payload};c.classList.add("picked");toast("Picked up — now click where it should go.");}
    }
    start=null;draggingStarted=false;
  };
  c.addEventListener("pointerup",finish);
  c.addEventListener("pointercancel",()=>{
    if(ghost){ghost.remove();ghost=null;}
    c.classList.remove("dragging");zones.forEach(zz=>zz.el.classList.remove("hot"));
    start=null;draggingStarted=false;
  });
  // keyboard: Enter/Space on a focused chip fires a click with detail 0 — pick it up
  c.addEventListener("click",e=>{
    if(e.detail!==0||c.classList.contains("spent"))return;
    if(picked&&picked.el===c){unpick();}
    else{unpick();picked={el:c,payload:c.payload};c.classList.add("picked");toast("Picked up — Tab to where it should go, then press Enter.");}
  });
  return c;
}
function spend(chip){chip.classList.add("spent");}

/* make an arbitrary stage element draggable like a chip */
function makeDragSource(elm,payload,ghostHtml){
  elm.classList.add("dragsrc");elm.style.touchAction="none";elm.style.cursor="grab";
  if(!elm.hasAttribute("tabindex"))elm.setAttribute("tabindex","0");
  let start=null,ghost=null,dragging=false;
  elm.addEventListener("pointerdown",e=>{start={x:e.clientX,y:e.clientY,id:e.pointerId};dragging=false;elm.setPointerCapture(e.pointerId);});
  elm.addEventListener("pointermove",e=>{
    if(!start||e.pointerId!==start.id)return;
    if(!dragging&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>7){
      dragging=true;unpick();
      ghost=el("div","ghostmini",ghostHtml||elm.outerHTML);document.body.appendChild(ghost);
    }
    if(dragging){
      ghost.style.left=e.clientX+"px";ghost.style.top=(e.pointerType==="touch"?e.clientY-56:e.clientY)+"px";
      const z=zoneAtDrag(e,elm);zones.forEach(zz=>zz.el.classList.toggle("hot",zz===z));
    }
  });
  const fin=e=>{
    if(!start||e.pointerId!==start.id)return;
    zones.forEach(zz=>zz.el.classList.remove("hot"));
    if(dragging){const z=zoneAtDrag(e,elm);ghost.remove();ghost=null;if(z)attemptDrop(z.el,payload,elm);}
    else if(picked&&picked.el!==elm){/* a chip is picked and this element may be a zone — its click handler takes it */}
    else if(picked&&picked.el===elm){unpick();}
    else{picked={el:elm,payload};elm.classList.add("picked");toast("Picked up — now click where it should go.");}
    start=null;dragging=false;
  };
  elm.addEventListener("pointerup",fin);
  elm.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();if(picked&&picked.el===elm)unpick();else{unpick();picked={el:elm,payload};elm.classList.add("picked");toast("Picked up — now choose where it should go.");}}});
  elm.addEventListener("pointercancel",()=>{if(ghost){ghost.remove();ghost=null;}start=null;dragging=false;zones.forEach(zz=>zz.el.classList.remove("hot"));});
}

/* ============================ scene plumbing ============================ */
let current=0,unlocked=0,doneFlags=[];
function saveProg(){try{localStorage.setItem("lookback-unlocked",String(unlocked));}catch(e){}}
function loadProg(){try{const v=parseInt(localStorage.getItem("lookback-unlocked"));if(!isNaN(v))unlocked=Math.min(v,SCENES.length-1);}catch(e){}}
function markDone(){
  if(doneFlags[current])return;
  doneFlags[current]=true;
  unlocked=Math.max(unlocked,Math.min(current+1,SCENES.length-1));
  saveProg();renderRail();
  $("#nextBtn").disabled=false;
  if(!REDUCED){$("#nextBtn").classList.add("pulse");setTimeout(()=>$("#nextBtn").classList.remove("pulse"),3600);}
}
function unDone(){doneFlags[current]=false;$("#nextBtn").disabled=true;}

function renderRail(){
  const ol=$("#steps");ol.innerHTML="";
  let lastGrp=null;
  SCENES.forEach((s,i)=>{
    if(s.grp!==lastGrp){ol.append(el("div","grp",s.grp));lastGrp=s.grp;}
    const li=el("li","step"+(i===current?" on":"")+(i<unlocked||doneFlags[i]?" done":""));
    const b=el("button","",`<span class="dot">${s.dot||(i===0?"·":i)}</span><span class="lbl">${s.label}</span>`);
    b.disabled=i>unlocked;
    b.addEventListener("click",()=>go(i));
    li.append(b);ol.append(li);
  });
  renderModelCard();
}
let sceneToken=0;   // bumps on every go(); async scene code checks it before touching the DOM
function go(i){
  current=i;clearScene();sceneToken++;setReadout(null);if(typeof tipEl!=="undefined")tipEl.style.opacity=0;
  const s=SCENES[i];
  if(s.needsText&&!RUN.text){toast("Pick a training text first.","bad");return go(0);}
  $("#scenehead .eyebrow").textContent=s.eyebrow;
  $("#scenehead h1").textContent=s.title;
  $("#scenehead .lede").innerHTML=s.lede;
  const stage=$("#stage");stage.innerHTML="";
  $("#backBtn").disabled=i===0;
  $("#nextBtn").disabled=true;
  $("#nextBtn").textContent=i===SCENES.length-1?"Start over":"Next step";
  doneFlags[i]=false;
  s.build(stage,sceneToken);
  if(s.autoDone)markDone();
  renderRail();
  window.scrollTo({top:0,behavior:"instant"});
}
$("#backBtn").addEventListener("click",()=>{if(current>0)go(current-1);});
$("#resetBtn").addEventListener("click",()=>{go(current);toast("Step reset — fresh start.");});
$("#nextBtn").addEventListener("click",()=>{
  if(current===SCENES.length-1){unlocked=0;saveProg();go(0);return;}
  if(current<SCENES.length-1)go(current+1);
});
/* ============================ color ramps ============================
   Cell colors are mixed in JS from the page's own tokens, so the heatmaps
   follow the light/dark theme without a second palette.               */
const PAL={};
function hexToRgb(h){h=h.trim();if(h[0]==="#")h=h.slice(1);if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function readPalette(){
  const cs=getComputedStyle(document.documentElement);
  for(const k of ["ink-lo","ink-hi","neg","posv","mid","bg","text","q","k","v","accent","good"]){
    const v=cs.getPropertyValue("--"+k).trim();
    PAL[k]=v.startsWith("#")?hexToRgb(v):[128,128,128];
  }
  PAL.ready=true;
}
const lin=c=>Math.pow(c/255,2.2),unlin=c=>Math.round(255*Math.pow(Math.max(0,Math.min(1,c)),1/2.2));
function mixRgb(a,b,t){return [0,1,2].map(i=>unlin(lin(a[i])*(1-t)+lin(b[i])*t));}
const rgbStr=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
/* sequential 0..1: surface → ink ("darker = more attention") */
function seqColor(t){if(!PAL.ready)readPalette();t=clamp(t,0,1);return rgbStr(mixRgb(PAL["ink-lo"],PAL["ink-hi"],Math.pow(t,0.8)));}
/* diverging -1..1: blue ← neutral → red */
function divColor(t){if(!PAL.ready)readPalette();t=clamp(t,-1,1);const pole=t<0?PAL.neg:PAL.posv;return rgbStr(mixRgb(PAL.mid,pole,Math.pow(Math.abs(t),0.85)));}
function cellInk(kind,t){ // readable text on top of a cell
  if(!PAL.ready)readPalette();
  const strong=kind==="seq"?t>0.5:Math.abs(t)>0.62;
  return strong?rgbStr(PAL.bg):rgbStr(PAL.text);
}
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{PAL.ready=false;});
new MutationObserver(()=>{PAL.ready=false;}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* ============================ tooltip ============================ */
const tipEl=el("div","");tipEl.id="tip";
Object.assign(tipEl.style,{position:"fixed",zIndex:130,pointerEvents:"none",background:"#151A24",color:"#E8ECF3",border:"1px solid #354056",borderRadius:"8px",padding:"6px 9px",fontSize:"12px",fontFamily:"var(--mono)",opacity:0,transition:"opacity .12s",maxWidth:"280px",whiteSpace:"pre-line",lineHeight:"1.4"});

function attachTip(node,fn){
  const move=e=>{const txt=fn();if(!txt){tipEl.style.opacity=0;return;}tipEl.innerHTML=txt;tipEl.style.opacity=1;
    const x=clamp(e.clientX+14,8,innerWidth-tipEl.offsetWidth-8),y=clamp(e.clientY+16,8,innerHeight-tipEl.offsetHeight-8);
    tipEl.style.left=x+"px";tipEl.style.top=y+"px";};

/* ============================ token strip ============================ */
/* tokens: string[]; opts: {ids, showIds, showPos, onClick(i,el), cls(i)->string} */
function tokenStrip(tokens,opts={}){
  const wrap=el("div","tokens"+(opts.showIds?" withids":"")+(opts.showPos?" withpos":""));
  const toks=tokens.map((t,i)=>{
    const d=el("span","tok"+(t==="\n"?" nl":"")+(opts.onClick?" click":"")+(opts.showPos?" pos":"")+(opts.cls?" "+(opts.cls(i)||""):""),esc(showTok(t)));

/* ============================ vector as bars ============================ */
/* vec: number[]; opts: {color:'q'|'k'|'v'|'x'|'p'|'o'|'good', w, gap, h, scale, label} */
const ROLECOL={q:"var(--q)",k:"var(--k)",v:"var(--v)",x:"var(--accent)",p:"var(--pos)",o:"var(--muted)",good:"var(--good)",neg:"var(--neg)",posv:"var(--posv)"};
function vecBars(vec,opts={}){
  const w=opts.w||4,gap=opts.gap==null?1.5:opts.gap,h=opts.h||26,n=vec.length;
  const W=n*(w+gap)-gap,mid=h/2;
  const span=el("span","vec");
  const svg=svgEl("svg",{width:W,height:h,viewBox:`0 0 ${W} ${h}`,role:"img","aria-label":opts.label||"vector"});
  svg.append(svgEl("line",{x1:0,x2:W,y1:mid,y2:mid,stroke:"var(--line)","stroke-width":1}));
  const rects=[];
  const fill=ROLECOL[opts.color||"o"];
  for(let i=0;i<n;i++){
    const r=svgEl("rect",{x:i*(w+gap),y:mid,width:w,height:0,rx:1,fill});rects.push(r);svg.append(r);
  }
  span.append(svg);
  const state={scale:opts.scale||1,vec};
  function update(v,scale){
    state.vec=v;if(scale)state.scale=scale;
    const s=state.scale||1;
    for(let i=0;i<n;i++){
      const t=clamp(v[i]/s,-1,1),len=Math.abs(t)*(mid-1);
      rects[i].setAttribute("height",Math.max(len,0.6));
      rects[i].setAttribute("y",t>=0?mid-len:mid);
    }
  }
  update(vec,state.scale);
  attachTip(span,()=>{const v=state.vec;return (opts.label?opts.label+"\n":"")+"["+Array.from(v).map(x=>fmt(x,2)).join(", ")+"]";});
  return {el:span,update,rects};
}
/* the largest |entry| across a list of vectors — pass as a shared scale so bars are comparable */
function maxAbs(...vecs){let m=1e-9;for(const v of vecs)for(const x of v)m=Math.max(m,Math.abs(x));return m;}
function matMaxAbs(M){return maxAbs(...M);}

/* a stack of labelled vector rows (e.g. the T×d matrix X shown as T little bar charts) */
function vecStack(M,labels,opts={}){
  const wrap=el("div","");
  const scale=opts.scale||matMaxAbs(M);
  const rows=M.map((v,i)=>{
    const r=el("div","vecrow");
    const lab=el("span","lab",esc(labels[i]));r.append(lab);
    if(opts.tag)r.append(Object.assign(el("span","tag "+opts.tag,opts.tag.toUpperCase()),{}));
    const vb=vecBars(v,{color:opts.color,scale,h:opts.h||22,w:opts.w||4,label:(opts.name?opts.name+" of ":"")+`“${showTok(labels[i])}”`});
    r.append(vb.el);wrap.append(r);return {el:r,vb,lab};
  });
  return {el:wrap,rows,scale,update(M2){const s=opts.scale||matMaxAbs(M2);rows.forEach((r,i)=>r.vb.update(M2[i],s));}};
}

/* ============================ matrix heatmap ============================ */
/* M: array of rows; opts: {rows:[labels], cols:[labels], kind:'seq'|'div', scale, numbers, cell,
   mask(i,j)->bool, onCell(i,j,el), rowOn, colOn, title, dims, legend, digits} */
function heatmap(M,opts={}){
  const R=M.length,C=M[0].length,kind=opts.kind||"seq";
  const outer=el("div","");
  if(opts.title){outer.append(el("div","mattitle",`<b>${opts.title}</b>`+(opts.dims?`<span class="dims">${opts.dims}</span>`:"")));}
  const wrap=el("div","matwrap");
  const g=el("div","mat"+(opts.rowq?" rowq":""));
  if(opts.cell)g.style.setProperty("--cell",opts.cell+"px");
  g.style.gridTemplateColumns=(opts.rows?"max-content ":"")+`repeat(${C},var(--cell))`;
  const cells=[];
  if(opts.cols){
    if(opts.rows)g.append(el("div","corner",""));
    opts.cols.forEach((c,j)=>{const d=el("div","cl"+(opts.colsPlain?" plain":""),esc(showTok(String(c))));d.dataset.j=j;g.append(d);});
  }
  const rlabs=[],clabs=[...g.querySelectorAll(".cl")];
  for(let i=0;i<R;i++){
    if(opts.rows){const d=el("div","rl",esc(showTok(String(opts.rows[i]))));d.dataset.i=i;g.append(d);rlabs.push(d);}
    cells.push([]);
    for(let j=0;j<C;j++){
      const d=el("div","c"+(opts.numbers?" num":"")+(opts.onCell?" pickable":""));
      d.dataset.i=i;d.dataset.j=j;g.append(d);cells[i].push(d);
      if(opts.onCell){d.tabIndex=0;d.addEventListener("click",()=>opts.onCell(i,j,d));d.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();opts.onCell(i,j,d);}});}
      attachTip(d,()=>{
        const v=state.M[i][j];
        if(state.mask&&state.mask(i,j))return (opts.tipMasked||"masked — a position may not look at the future");
        const rl=opts.rows?`${showTok(String(opts.rows[i]))} → `:"",cl=opts.cols?showTok(String(opts.cols[j])):`[${j}]`;
        return (opts.tip?opts.tip(i,j,v):`${rl}${cl}\n${kind==="seq"?pct(v,1):fmt(v,3)}`);
      });
    }
  }
  wrap.append(g);outer.append(wrap);
  if(opts.legend!==false){
    const lg=el("div","matlegend");
    if(kind==="seq")lg.innerHTML=`<span>0</span><span class="ramp seq"></span><span>1</span><span style="margin-left:6px;color:var(--faint)">${opts.legendText||"darker = more attention"}</span>`;
    else lg.innerHTML=`<span class="negl">−${fmt(opts.scale||matMaxAbs(M),2).replace("−","")}</span><span class="ramp div"></span><span class="posl">+${fmt(opts.scale||matMaxAbs(M),2)}</span><span style="margin-left:6px;color:var(--faint)">${opts.legendText||"blue = negative · red = positive"}</span>`;
    outer.append(lg);
  }
  const state={M,mask:opts.mask,scale:opts.scale};
  const digits=opts.digits==null?2:opts.digits;
  function paint(){
    const s=state.scale||(kind==="div"?matMaxAbs(state.M):1);
    if(kind==="div"&&opts.legend!==false){const nl=outer.querySelector(".negl"),pl=outer.querySelector(".posl");if(nl){nl.textContent="−"+s.toFixed(2);pl.textContent="+"+s.toFixed(2);}}
    for(let i=0;i<R;i++)for(let j=0;j<C;j++){
      const d=cells[i][j],v=state.M[i][j];
      if(state.mask&&state.mask(i,j)){d.classList.add("masked");d.textContent=opts.maskGlyph==null?"":opts.maskGlyph;d.style.background="";d.style.color="";continue;}
      d.classList.remove("masked");
      const t=kind==="seq"?v:v/s;
      d.style.background=kind==="seq"?seqColor(t):divColor(t);
      d.style.color=cellInk(kind,t);
      if(opts.numbers)d.textContent=kind==="seq"?(v>=0.995?"1":v.toFixed(digits).replace(/^0/,"")):fmt(v,digits);
    }
  }
  paint();
  function setMask(fn){state.mask=fn;paint();}
  function update(M2,scale){state.M=M2;if(scale!=null)state.scale=scale;paint();}
  function highlight(i,j){rlabs.forEach(r=>r.classList.toggle("on",+r.dataset.i===i));clabs.forEach(c=>c.classList.toggle("on",+c.dataset.j===j));
    for(const row of cells)for(const d of row)d.classList.toggle("sel",+d.dataset.i===i&&(j==null||+d.dataset.j===j));}
  function rowHighlight(i){rlabs.forEach(r=>r.classList.toggle("on",+r.dataset.i===i));for(const row of cells)for(const d of row)d.classList.toggle("sel",+d.dataset.i===i);}
  return {el:outer,grid:g,cells,rlabs,clabs,update,setMask,highlight,rowHighlight,paint,state};
}

/* ============================ probability bars ============================ */
/* probs: number[] over vocab; opts: {k, vocab, target, bet, chosen, onPick(id), always:[ids]} */
function probBars(probs,opts={}){
  const wrap=el("div","bars"+(opts.onPick?" click":""));
  const state={probs,target:opts.target,bet:opts.bet,chosen:opts.chosen,rows:[]};
  function render(){
    wrap.innerHTML="";state.rows=[];

    for(const extra of [state.target,state.bet,state.chosen,...(opts.always||[])])if(extra!=null&&!ids.includes(extra))ids.push(extra);
    ids.forEach(id=>{
      const p=state.probs[id];

      const l=el("span","bl"+(isT?" target":""),esc(showTok(opts.vocab[id]))+(isT?" ✓":""));
      const bt=el("span","bt"+(isT?" target":isC?" chosen":isB?" bet":""));
      const i=el("i");i.style.width=pct(clamp(p,0,1),1);bt.append(i);
      const v=el("span","bv",pct(p,1));
      if(opts.onPick){l.addEventListener("click",()=>opts.onPick(id));bt.addEventListener("click",()=>opts.onPick(id));l.tabIndex=0;l.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();opts.onPick(id);}});}
