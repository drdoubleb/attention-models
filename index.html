/* ============================ loss chart ============================ */
/* opts: {w,h, ref:{y,label}, xmax}; update(points:[{x,y}]) */
function lossChart(opts={}){
  const W=opts.w||560,H=opts.h||170,pl=40,pr=16,pt=12,pb=26;
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,class:"chart",role:"img","aria-label":"training loss over steps"});
  const gGrid=svgEl("g"),area=svgEl("path",{class:"area"}),ln=svgEl("path",{class:"ln"}),ref=svgEl("line",{class:"ln ref"}),refT=svgEl("text",{class:"lbl"}),dot=svgEl("circle",{class:"dot",r:4}),endT=svgEl("text",{class:"lbl","text-anchor":"end"});
  svg.append(gGrid,area,ref,refT,ln,dot,endT);
  const state={ymax:opts.ymax||null,xmax:opts.xmax||100};
  function update(pts,o={}){
    if(o.xmax)state.xmax=o.xmax;
    const ymax=state.ymax||Math.max(0.1,...pts.map(p=>p.y),opts.ref?opts.ref.y:0)*1.08;
    const sx=x=>pl+(x/Math.max(1,state.xmax))*(W-pl-pr),sy=y=>pt+(1-y/ymax)*(H-pt-pb);
    gGrid.innerHTML="";
    const ticks=4;
    for(let i=0;i<=ticks;i++){
      const y=ymax*i/ticks;
      gGrid.append(svgEl("line",{class:"grid",x1:pl,x2:W-pr,y1:sy(y),y2:sy(y)}));
      const t=svgEl("text",{class:"lbl",x:pl-6,y:sy(y)+3,"text-anchor":"end"});t.textContent=y.toFixed(1);gGrid.append(t);
    }
    gGrid.append(svgEl("line",{class:"axis",x1:pl,x2:W-pr,y1:sy(0),y2:sy(0)}));
    for(const fx of [0,0.5,1]){const x=Math.round(state.xmax*fx);const t=svgEl("text",{class:"lbl",x:sx(x),y:H-8,"text-anchor":fx===0?"start":fx===1?"end":"middle"});t.textContent=x+(fx===1?" steps":"");gGrid.append(t);}
    if(opts.ref){ref.setAttribute("x1",pl);ref.setAttribute("x2",W-pr);ref.setAttribute("y1",sy(opts.ref.y));ref.setAttribute("y2",sy(opts.ref.y));refT.setAttribute("x",W-pr);refT.setAttribute("y",sy(opts.ref.y)-4);refT.setAttribute("text-anchor","end");refT.textContent=opts.ref.label;}
    if(!pts.length){ln.setAttribute("d","");area.setAttribute("d","");dot.setAttribute("r",0);endT.textContent="";return;}
    const d=pts.map((p,i)=>(i?"L":"M")+sx(p.x).toFixed(1)+" "+sy(p.y).toFixed(1)).join(" ");
    ln.setAttribute("d",d);
    area.setAttribute("d",d+` L${sx(pts[pts.length-1].x).toFixed(1)} ${sy(0)} L${sx(pts[0].x).toFixed(1)} ${sy(0)} Z`);
    const last=pts[pts.length-1];dot.setAttribute("cx",sx(last.x));dot.setAttribute("cy",sy(last.y));dot.setAttribute("r",4);
    endT.setAttribute("x",sx(last.x)-8);endT.setAttribute("y",sy(last.y)-8);endT.textContent="loss "+last.y.toFixed(2);
  }
  update([]);
  return {el:svg,update};
}

/* ============================ attention arcs ============================ */
/* Draws arcs from token `from` back to every earlier token; width ∝ weight. */
function drawArcs(container,tokEls,from,weights,opts={}){
  let svg=container.querySelector(":scope > svg.arcsvg");
  if(!svg){svg=svgEl("svg",{class:"arcsvg"});svg.style.cssText="position:absolute;left:0;top:0;overflow:visible;pointer-events:none";container.append(svg);}
  svg.innerHTML="";
  const cr=container.getBoundingClientRect();
  svg.setAttribute("width",cr.width);svg.setAttribute("height",cr.height);
  const fr=tokEls[from].getBoundingClientRect();
  const fx=fr.left-cr.left+fr.width/2,fy=fr.top-cr.top;
  for(let j=0;j<=from;j++){
    const w=weights[j];if(w<0.02)continue;
    const r=tokEls[j].getBoundingClientRect();const x=r.left-cr.left+r.width/2,y=r.top-cr.top;
    const lift=Math.min(60,18+Math.abs(fx-x)*0.25);
    const p=svgEl("path",{d:j===from?`M${fx} ${fy} c -10 -22, 10 -22, 0 0`:`M${fx} ${fy} C ${fx} ${fy-lift}, ${x} ${y-lift}, ${x} ${y}`,fill:"none",stroke:opts.color||"var(--ink-hi)","stroke-width":(1+w*7).toFixed(1),"stroke-linecap":"round",opacity:(0.25+w*0.75).toFixed(2)});
    svg.append(p);
  }
}
/* ============================ strips ============================
   A "strip" is one vector of 16 numbers drawn as 16 square cells on the
   signed (blue↔red) ramp — the same object that later becomes a row of a
   matrix.  opts: {label, role:'q'|'k'|'v'|'x'|'p'|'o', scale, cell, onCell, tip(j)->string, index:boolean, name} */
function strip(vec,opts={}){
  const n=vec.length;
  const wrap=el("div","strip"+(opts.role?" "+opts.role:"")+(opts.cls?" "+opts.cls:""));
  if(opts.label!=null){const lab=el("span","slab",esc(showTok(String(opts.label))));if(opts.role)lab.append(el("span","tag "+opts.role,opts.role.toUpperCase()));wrap.append(lab);}
  const cellsWrap=el("span","scells");
  if(opts.cell)cellsWrap.style.setProperty("--cell",opts.cell+"px");
  const cells=[];
  for(let j=0;j<n;j++){const d=el("span","sc"+(opts.onCell?" pickable":""));d.dataset.j=j;cellsWrap.append(d);cells.push(d);
    if(opts.onCell){d.tabIndex=0;d.addEventListener("click",()=>opts.onCell(j,d));d.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();opts.onCell(j,d);}});}
    attachTip(d,()=>opts.tip?opts.tip(j,state.vec[j]):`${opts.name||"value"}[${j}] = ${fmt(state.vec[j],3)}`);}
  wrap.append(cellsWrap);
  if(opts.index){const ix=el("span","sindex");for(let j=0;j<n;j++)ix.append(el("i","",String(j)));wrap.append(ix);}
  const state={vec,scale:opts.scale||maxAbs(vec)};
  function paint(){const s=state.scale||1;for(let j=0;j<n;j++){const t=clamp(state.vec[j]/s,-1,1);cells[j].style.background=state.vec[j]===0&&opts.zeroBlank?"":divColor(t);}}
  paint();
  return {el:wrap,cells,state,update(v,scale){state.vec=v;if(scale!=null)state.scale=scale;paint();},setScale(s){state.scale=s;paint();}};
}
/* a strip drawn on the sequential ramp (0..1): attention rows, probability rows */
function seqStrip(vec,opts={}){
  const n=vec.length,wrap=el("div","strip seq"+(opts.cls?" "+opts.cls:""));
  if(opts.label!=null)wrap.append(el("span","slab",esc(showTok(String(opts.label)))));
  const cellsWrap=el("span","scells");if(opts.cell)cellsWrap.style.setProperty("--cell",opts.cell+"px");
  const cells=[];for(let j=0;j<n;j++){const d=el("span","sc");cellsWrap.append(d);cells.push(d);attachTip(d,()=>opts.tip?opts.tip(j,state.vec[j]):`${opts.name||"weight"}[${j}] = ${state.vec[j].toFixed(3)}`);}
  wrap.append(cellsWrap);

/* proportional wheel: sector area = probability; spin lands inside the drawn sector */
function wheel(probs,vocab,opts={}){
  const size=opts.size||260,r=size/2-4,cx=size/2,cy=size/2;
  const wrap=el("div","wheel");
  const svg=svgEl("svg",{viewBox:`0 0 ${size} ${size}`,width:size,height:size,role:"img","aria-label":"next-token probabilities as a wheel"});
  const g=svgEl("g");svg.append(g);
  const pointer=svgEl("polygon",{points:`${cx-9},2 ${cx+9},2 ${cx},22`,fill:"var(--accent)",stroke:"var(--panel)","stroke-width":2});
  svg.append(pointer);
  wrap.append(svg);
  let angle=0;
  const state={probs,sectors:[]};
  function paint(){
    g.innerHTML="";state.sectors=[];
    const order=[...state.probs.keys()].sort((a,b)=>state.probs[b]-state.probs[a]);
    let a0=0;const seqIds=order.filter(id=>state.probs[id]>1e-6);
    seqIds.forEach((id,k)=>{
      const p=state.probs[id],a1=a0+p*2*Math.PI;
      state.sectors.push({id,a0,a1});
      const large=a1-a0>Math.PI?1:0;
      const x0=cx+r*Math.sin(a0),y0=cy-r*Math.cos(a0),x1=cx+r*Math.sin(a1),y1=cy-r*Math.cos(a1);
      const d=p>=0.99999?`M${cx} ${cy-r} A${r} ${r} 0 1 1 ${cx-0.01} ${cy-r} Z`:`M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} Z`;
      const path=svgEl("path",{d,fill:seqColor(0.18+0.72*(k%5)/4),stroke:"var(--panel)","stroke-width":2});
      path.dataset.id=id;g.append(path);
      attachTip(path,()=>`${showTok(vocab[id])}: ${pct(p,1)}`);
      if(p>0.035){const am=(a0+a1)/2,rr=r*0.66;const t=svgEl("text",{x:cx+rr*Math.sin(am),y:cy-rr*Math.cos(am),"text-anchor":"middle","dominant-baseline":"middle","font-size":p>0.15?13:11,"font-family":"var(--mono)",fill:cellInk("seq",0.18+0.72*(k%5)/4)});t.textContent=showTok(vocab[id]).slice(0,10);g.append(t);}
      a0=a1;
    });

  }
  paint();
  /* spin so the pointer (at the top, angle 0) ends inside the sector of `id`; resolves after the animation */
  function spinTo(id,rng){
    const s=state.sectors.find(x=>x.id===id);if(!s)return Promise.resolve();
    const span=s.a1-s.a0,inside=s.a0+span*(0.15+0.7*(rng?rng():Math.random()));

    const turns=REDUCED?0:3;
    const from=angle,to=targetDeg-360*turns-((from%360)+360)%360+((from%360)+360)%360; // final absolute angle
    const final=targetDeg-360*turns;

    return new Promise(res=>{
      function frame(now){const t=Math.min(1,(now-t0)/(dur||1));const e=1-Math.pow(1-t,3);angle=from+(final-from)*e;g.setAttribute("transform",`rotate(${angle} ${cx} ${cy})`);if(t<1)requestAnimationFrame(frame);else{angle=((final%360)+360)%360;g.setAttribute("transform",`rotate(${angle} ${cx} ${cy})`);res();}}
      if(dur===0){angle=((final%360)+360)%360;g.setAttribute("transform",`rotate(${angle} ${cx} ${cy})`);res();}else requestAnimationFrame(frame);

}
/* ============================ shared run state ============================

const CFG={dModel:16,context:16,mlpHidden:32,batch:8,lr:3e-3,seed:42,steps:3000,batchSeed:1234};
const CHEAT_CFG={steps:6000,lr:5e-3};          // the unmasked twin needs longer to become a crisp cheater
const RUN={
  textId:null,text:"",title:"",author:"",
  tok:null,ids:[],vocab:[],V:0,
  model:null,        // trained in the background right after the text is picked
  trained:false,progress:0,losses:[],curve:[],
  cheat:null,cheatTrained:false,cheatProgress:0,cheatLosses:[],
  probe:null,        // {ids,tokens}: the running example every mechanism scene uses
  floors:{uniform:0,bigram:0},
  game:{contexts:[],score:[],modelScore:[]},
  pairs:null,        // contrast pairs for the "look back" demo
  gen:{prompt:null,ids:[]},
};
const STORE_VER="v3";
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

/* fresh, untrained model with the canonical seed (same init as the trained one started from) */
function freshModel(){return new TinyTransformer({vocabSize:RUN.V,dModel:CFG.dModel,context:CFG.context,mlpHidden:CFG.mlpHidden,seed:CFG.seed});}

/* ------------------------------------------------------------ set text ---- */
function setText(entry){
  const text=entry.text.trim();
  const tok=new WordTokenizer(text);
  const ids=tok.trainingTokens.map(t=>tok.idOf(t));
  if(ids.length<CFG.context+2)return {ok:false,why:`That text is only ${ids.length} tokens long — the model reads ${CFG.context} at a time, so it needs at least ${CFG.context+2}. Add a few more lines.`};
  if(tok.vocabSize<6)return {ok:false,why:"That text has fewer than six distinct words — there's nothing for a model to learn there."};
  if(tok.vocabSize>400)return {ok:false,why:`That text has ${tok.vocabSize} distinct tokens. Keep it under 400 so the tiny model (and the screen) can hold the vocabulary.`};
  // trial assignment so the window search can use RUN.vocab
  const prev={ids:RUN.ids,vocab:RUN.vocab,_succ:RUN._succ};
  RUN.ids=ids;RUN.vocab=tok.vocab;RUN._succ=null;
  const win=chooseWindow();
  if(!win){Object.assign(RUN,prev);return {ok:false,why:"Pick a passage where some word appears twice within one line-or-so, followed by something different each time — that repetition is the entire plot of this tutorial."};}
  stopTraining();
  Object.assign(RUN,{textId:entry.id,text,title:entry.title,author:entry.author||"",tok,ids,vocab:tok.vocab,V:tok.vocabSize,_succ:null,
    model:null,trained:false,progress:0,losses:[],curve:[],cheat:null,cheatTrained:false,cheatProgress:0,cheatLosses:[],pairs:null,
    guesses:{},handRow:null,betTop:null,trainDone:false,generated:null,chopped:false,fwd0:null,fwdStar:null,gen:{prompt:null,ids:[]}});
  RUN.floors={uniform:Math.log(RUN.V),bigram:bigramEntropy(ids,RUN.V)};
  RUN.win=win;RUN.rounds=chooseRounds(win);
  RUN.probe={ids:win.ids.slice(0,CFG.context),tokens:win.tokens.slice(0,CFG.context)};
  RUN.paramCount=32*RUN.V+CFG.context*CFG.dModel+4*CFG.dModel*CFG.dModel+2*CFG.dModel*CFG.mlpHidden;
  lsSet("lookback-text",JSON.stringify({id:entry.id,text:entry.id==="own"?text:undefined}));
  loadRun();
  startTraining();
  return {ok:true};
}
/* forward caches on the window: newborn (θ₀) and trained (θ*), memoised */
function fwd0(){if(!RUN.fwd0)RUN.fwd0=freshModel().forward(RUN.probe.ids);return RUN.fwd0;}
function fwdStar(){if(!RUN.trained)return null;if(!RUN.fwdStar)RUN.fwdStar=RUN.model.forward(RUN.probe.ids);return RUN.fwdStar;}
function fwdFor(trained){return trained?fwdStar():fwd0();}
function modelFor(trained){return trained?RUN.model:freshModel();}
function restoreText(){
  const raw=lsGet("lookback-text");if(!raw)return false;
  try{const o=JSON.parse(raw);const e=o.id==="own"?{id:"own",title:"Your own text",author:"",text:o.text||""}:TEXTS.find(t=>t.id===o.id);if(e&&e.text)return setText(e).ok;}catch(err){}

/* ------------------------------------------------- the window & focus ----
   One 16-slot window of the text is the running example of every scene.
   The focus slot f is a word that also occurs earlier in the window but
   is followed by something different there — so the word alone cannot
   decide what comes next; only the words before it can.  Windows start
   at the beginning of a line or sentence; the earliest one that has such
   a slot (preferring a slot followed by a word) wins.                    */
const isWordId=id=>/^[a-z0-9]/.test(RUN.vocab[id]);
function findFocus(W){
  let fallback=null;
  for(let j=4;j<=13;j++){
    if(!isWordId(W[j]))continue;
    for(let i=0;i<j;i++){
      if(W[i]===W[j]&&W[i+1]!==W[j+1]){
        const cand={f:j,i0:i,wordSucc:isWordId(W[j+1])};
        if(cand.wordSucc)return cand;
        if(!fallback)fallback=cand;
      }
    }
  }
  return fallback;
}
function chooseWindow(){
  const ids=RUN.ids,vocab=RUN.vocab,T=CFG.context;
  const starts=[0];
  for(let t=1;t+T<ids.length;t++){const p=vocab[ids[t-1]];if(p==="\n"||p==="."||p==="!"||p==="?")if(vocab[ids[t]]!=="\n")starts.push(t);}
  let best=null;
  for(const s of starts){
    const W=ids.slice(s,s+T+1);if(W.length<T+1)continue;
    const fo=findFocus(W);if(!fo)continue;
    const score=(fo.wordSucc?0:10)+s*0.001;
    if(!best||score<best.score)best={start:s,ids:W,score,...fo};
  }
  if(!best)return null;
  const W=best.ids;
  return {start:best.start,ids:W,tokens:W.map(i=>vocab[i]),f:best.f,i0:best.i0,tok:vocab[W[best.f]],a:vocab[W[best.i0+1]],b:vocab[W[best.f+1]],aId:W[best.i0+1],bId:W[best.f+1],d:best.f-best.i0};
}
/* successor statistics over the whole text: id -> Map(nextId -> count) */
function successors(){
  if(RUN._succ)return RUN._succ;
  const m=new Map();for(let t=0;t+1<RUN.ids.length;t++){const a=RUN.ids[t],b=RUN.ids[t+1];if(!m.has(a))m.set(a,new Map());const mm=m.get(a);mm.set(b,(mm.get(b)||0)+1);}
  return RUN._succ=m;
}
function succEntropy(id){const mm=successors().get(id);if(!mm)return 0;let n=0;for(const c of mm.values())n+=c;let h=0;for(const c of mm.values()){const p=c/n;h-=p*Math.log(p);}return h;}
function topSuccessors(id,k=3){const mm=successors().get(id)||new Map();return [...mm.entries()].sort((a,b)=>b[1]-a[1]).slice(0,k).map(([nid,c])=>({id:nid,count:c}));}
/* the three rounds of the guessing game: an easy slot before f, f itself, and the most open slot after f */
function chooseRounds(win){
  const W=win.ids,f=win.f;
  let A=null;for(let k=1;k<f;k++){if(isWordId(W[k+1])&&(successors().get(W[k])||new Map()).size===1){A=k;break;}}
  if(A==null){for(let k=1;k<f;k++)if(isWordId(W[k+1])){A=k;break;}}
  if(A==null)A=Math.max(1,f-1);
  let C=null,bestH=-1;for(let k=f+1;k<=14;k++){if(W[k+1]==null)break;const h=succEntropy(W[k])+(isWordId(W[k+1])?1:0);if(h>bestH){bestH=h;C=k;}}

  return {A,f,C};

/* per-learner artefacts that survive a reload */
function saveRun(){lsSet(storeKey("run"),JSON.stringify({guesses:RUN.guesses,handRow:RUN.handRow,betTop:RUN.betTop,trainDone:RUN.trainDone,generated:RUN.generated,chopped:RUN.chopped}));}
function loadRun(){try{const o=JSON.parse(lsGet(storeKey("run"))||"null");if(o)Object.assign(RUN,o);}catch(e){}}

/* ------------------------------------------------------- statistics ---- */
function bigramEntropy(ids,V){   // H(next | previous) in nats, from counts
  const pair=new Map(),prev=new Map();
  for(let t=0;t+1<ids.length;t++){const k=ids[t]*V+ids[t+1];pair.set(k,(pair.get(k)||0)+1);prev.set(ids[t],(prev.get(ids[t])||0)+1);}
  let H=0;const N=ids.length-1;
  for(const [k,c] of pair){const p=c/N,cond=c/prev.get(Math.floor(k/V));H-=p*Math.log(cond);}

}
function rowEntropy(row){let h=0;for(const p of row)if(p>0)h-=p*Math.log(p);return h;}
function meanAttnEntropy(model,ids){const A=model.forward(ids).A;return A.reduce((s,r)=>s+rowEntropy(r),0)/A.length;}
function cosine(a,b){let d=0,na=0,nb=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return d/Math.sqrt(na*nb+1e-12);}

function dot(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s;}

/* the corpus positions where a next-token guess is interesting: preceded by ≥4 tokens, next is a word */
function gameContexts(n=4,minCtx=5,maxCtx=8){
  const ids=RUN.ids,vocab=RUN.vocab,isWord=id=>/^[a-z0-9']/.test(vocab[id]);
  const cands=[];
  for(let t=minCtx;t+1<ids.length;t++){
    if(!isWord(ids[t+1]))continue;
    if(ids.slice(t-minCtx+1,t+1).some(i=>vocab[i]==="\n"))continue;
    cands.push(t);
  }
  if(!cands.length)return [];
  const out=[],seen=new Set();const stride=Math.max(1,Math.floor(cands.length/n));
  for(let i=0;i<n*3&&out.length<n;i++){
    const t=cands[Math.min(cands.length-1,Math.floor((i%n)*stride+stride/2)+Math.floor(i/n))];
    if(t==null)continue;
    const len=Math.min(maxCtx,t+1);let start=t+1-len;
    while(start<t&&vocab[ids[start]]==="\n")start++;
    const ctx=ids.slice(start,t+1),truth=ids[t+1];
    const key=ctx.join(",");if(seen.has(key))continue;seen.add(key);
    // plausible distractors: other words that follow the same previous token somewhere in the text
    const follow=new Set();for(let s=0;s+1<ids.length;s++)if(ids[s]===ids[t]&&ids[s+1]!==truth&&isWord(ids[s+1]))follow.add(ids[s+1]);
    const pool=[...follow];
    const words=[...vocab.keys()].filter(isWord).filter(id=>id!==truth&&!follow.has(id));
    const rng=mulberry32(t*31+7);
    while(pool.length<3&&words.length){pool.push(words.splice(Math.floor(rng()*words.length),1)[0]);}
    const options=[truth,...pool.slice(0,3)].sort(()=>rng()-0.5);
    out.push({t,ctx,truth,options});
  }
  return out;
}

/* two contexts that end in the same two tokens but continue differently, where the
   trained model separates them — the honest "it looked further back" demo */
function findContrastPairs(model){
  const ids=RUN.ids,vocab=RUN.vocab;
  const best=[];
  for(const L of [6,5,4,3]){
    const byKey=new Map();
    for(let t=L-1;t+1<ids.length;t++){
      const key=ids[t-1]+"_"+ids[t];
      if(!byKey.has(key))byKey.set(key,[]);
      byKey.get(key).push({start:t-L+1,t,next:ids[t+1]});
    }
    for(const occ of byKey.values()){
      const nexts=new Set(occ.map(o=>o.next));if(nexts.size<2)continue;
      for(let a=0;a<occ.length;a++)for(let b=a+1;b<occ.length;b++){
        if(occ[a].next===occ[b].next)continue;
        const c1=ids.slice(occ[a].start,occ[a].t+1),c2=ids.slice(occ[b].start,occ[b].t+1);
        if(c1.some(i=>vocab[i]==="\n")||c2.some(i=>vocab[i]==="\n"))continue;
        if(c1.join()===c2.join())continue;
        const p1=model.nextTokenDistribution(c1).probs,p2=model.nextTokenDistribution(c2).probs;
        const sep=Math.min(p1[occ[a].next]-p2[occ[a].next],p2[occ[b].next]-p1[occ[b].next]);
        best.push({sep,L,a:{ctx:c1,next:occ[a].next,p:p1[occ[a].next]},b:{ctx:c2,next:occ[b].next,p:p2[occ[b].next]}});
      }
    }
  }
  best.sort((x,y)=>y.sep-x.sep);
  return best;
}

/* ------------------------------------------------------ training loop ----
   Runs in small time-sliced chunks on the main thread so the page stays
   responsive; deterministic (seeded init + seeded batches) so a replay of
   training in the training scene ends at exactly these weights.           */
let trainerTimer=null;const trainListeners=new Set();
function onTrain(fn){trainListeners.add(fn);return ()=>trainListeners.delete(fn);}
function emitTrain(){for(const fn of trainListeners){try{fn();}catch(e){console.error(e);}}}
function stopTraining(){if(trainerTimer){clearTimeout(trainerTimer);trainerTimer=null;}if(typeof cheatTimer!=="undefined"&&cheatTimer){clearTimeout(cheatTimer);cheatTimer=null;}}

function startTraining(){
  const cached=lsGet(storeKey("model"));
  if(cached){
    try{const o=JSON.parse(cached);RUN.model=TinyTransformer.deserialize(o.model);RUN.losses=o.losses;RUN.curve=o.curve;RUN.trained=true;RUN.progress=1;finishTraining();return;}catch(e){lsDel(storeKey("model"));}
  }
  RUN.model=freshModel();RUN.trained=false;RUN.progress=0;RUN.losses=[];RUN.curve=[];
  const rng=mulberry32(CFG.batchSeed);let step=0;
  RUN.curve.push({x:0,y:corpusLoss(RUN.model,RUN.ids)});
  const tick=()=>{
    const t0=performance.now();
    while(step<CFG.steps&&performance.now()-t0<24){
      const {loss}=trainStep(RUN.model,RUN.ids,{batchSize:CFG.batch,lr:CFG.lr,rng});
      RUN.losses.push(loss);step++;
      if(step%50===0||step===CFG.steps)RUN.curve.push({x:step,y:corpusLoss(RUN.model,RUN.ids)});
    }
    RUN.progress=step/CFG.steps;
    if(step<CFG.steps){trainerTimer=setTimeout(tick,0);emitTrain();}
    else{trainerTimer=null;RUN.trained=true;
      lsSet(storeKey("model"),JSON.stringify({model:RUN.model.serialize({includeOptimizer:false}),losses:RUN.losses.map(x=>+x.toFixed(4)),curve:RUN.curve}));
      finishTraining();}
  };
  trainerTimer=setTimeout(tick,30);
}
function finishTraining(){
  RUN.fwdStar=null;
  RUN.pairs=findContrastPairs(RUN.model);
  emitTrain();
  startCheatTraining();
}

/* the unmasked twin: identical model, but every position may look at the future */
let cheatTimer=null;
function startCheatTraining(){
  if(RUN.cheatTrained||cheatTimer)return;
  const cached=lsGet(storeKey("cheat"));
  if(cached){try{RUN.cheat=TinyTransformer.deserialize(JSON.parse(cached));RUN.cheat.causal=false;RUN.cheatTrained=true;RUN.cheatProgress=1;emitTrain();return;}catch(e){lsDel(storeKey("cheat"));}}
  RUN.cheat=freshModel();RUN.cheat.causal=false;RUN.cheatLosses=[];
  const rng=mulberry32(CFG.batchSeed);let step=0;
  const model=RUN.cheat;
  const tick=()=>{
    if(RUN.cheat!==model){cheatTimer=null;return;}
    const t0=performance.now();
    while(step<CHEAT_CFG.steps&&performance.now()-t0<16){
      const {loss}=trainStep(RUN.cheat,RUN.ids,{batchSize:CFG.batch,lr:CHEAT_CFG.lr,rng});
      RUN.cheatLosses.push(loss);step++;
    }
    RUN.cheatProgress=step/CHEAT_CFG.steps;
    if(step<CHEAT_CFG.steps){cheatTimer=setTimeout(tick,40);}
    else{cheatTimer=null;RUN.cheatTrained=true;lsSet(storeKey("cheat"),JSON.stringify(RUN.cheat.serialize({includeOptimizer:false})));emitTrain();}
  };
  cheatTimer=setTimeout(tick,200);
}

/* honest evaluation of any model: causal loss over the corpus (what generation actually faces) */
function causalCorpusLoss(model){const was=model.causal;model.causal=true;const l=corpusLoss(model,RUN.ids);model.causal=was;return l;}

    <div class="state${RUN.trained?" ok":""}">${RUN.trained?"trained · ready":"training in background…"}</div>`;
}
onTrain(renderModelCard);

/* wait until the background model is trained; shows a small live progress note in `host` meanwhile */
function whenTrained(host,token,fn){
  if(RUN.trained){fn();return;}
  const note=el("div","helper",`<span class="mono">training in the background… <b class="pg">${Math.round(RUN.progress*100)}%</b></span> — the model you'll take apart is being trained on “${esc(RUN.title)}” right now.`);

    if(token!=null&&token!==sceneToken){off();return;}
    const pg=note.querySelector(".pg");if(pg)pg.textContent=Math.round(RUN.progress*100)+"%";

  });
}

    Ebox.append(Eheat.el);leftCol.append(Ebox);
    // strip + grid
    const s=slotStrip(w.tokens.slice(0,T),{onTap:(i,d)=>fetchRow(i)});rightCol.append(el("h3","sub","your 16 slots — tap to fetch"),s.el);
    const gridBox=el("div","card");gridBox.append(el("h3","",`the input x₀ <span class="dims">${T} × ${D}</span> · one row per slot`));

      const rw=el("div","xrow");
      const lab=el("span","xlab",`<span class="i">${i}</span><span class="t">${esc(showTok(w.tokens[i]))}</span>`);
      const st=strip(X[i],{scale:0.3,onCell:(j)=>{if(!built[i])return;const c=fwdFor(trained);setReadout(posAdded[i]?RC.x0(c,i,j):`x_tok[${i}][${j}] = E[${w.ids[i]}][${j}] = <b>${F3(c.xTok[i][j])}</b>`);},tip:(j,v)=>built[i]?`${posAdded[i]?"x₀":"E row"}[${i}][${j}] = ${F3(v)}`:"empty — fetch this slot"});
      rw.append(lab,st.el);gridEl.append(rw);rows.push({rw,st,lab});
    }

    function paintRow(i){const c=fwdFor(trained);const v=!built[i]?zeros(1,D)[0]:posAdded[i]?c.x0[i]:c.xTok[i];rows[i].st.update(v,scaleNow());rows[i].rw.classList.toggle("filled",built[i]);rows[i].rw.classList.toggle("pos",posAdded[i]);}
    function twinsText(){
      const c=fwdFor(trained);const a=posAdded[w.i0]?c.x0[w.i0]:c.xTok[w.i0],b=posAdded[w.f]?c.x0[w.f]:c.xTok[w.f];
      let same=0;for(let j=0;j<D;j++)if(Math.abs(a[j]-b[j])<1e-12)same++;
      twins.innerHTML=`<b>slot ${w.i0}</b> and <b>slot ${w.f}</b>, both ${q(w.tok)}: ${same===D?`<span class="warn">identical in ${D} of ${D} cells</span>`:`<span class="ok">different in ${D-same} of ${D} cells</span>`}`;
    }

    function fetchRow(i){

      Eheat.rowHighlight(w.ids[i]);Eheat.cells[w.ids[i]][0].scrollIntoView({block:"nearest",behavior:REDUCED?"instant":"smooth"});

        coach(`Identical, cell for cell — the table has one row per id, and both slots hold id ${w.ids[w.f]}. Yet one is followed by ${q(w.a)} and the other by ${q(w.b)}. Fetch the rest, then give each slot an address.`);}

  }

      const c=el("div","pour"+(i>f?" covered":"")+(i===f?" self":""));
      c.innerHTML=`<div class="gauge"><i></i></div><div class="pv">0%</div><div class="pl">${i}<br><span>${esc(showTok(w.tokens[i]))}</span></div><div class="pb"><button type="button" class="minus" aria-label="less">−</button><button type="button" class="plus" aria-label="more">+</button></div>`;

  }

    const rawStrip=strip(fwd0().x0[f],{role:"x",tip:(j,v)=>`x₀[${f}][${j}] = ${F3(v)}`});rawRow.append(rawStrip.el,el("span","helper","← the raw strip, for reference"));
    registerZone(rawStrip.el,p=>p==="query"?"Compare like with like: query against key. The raw strip isn't in the game any more.":false,4);
    right.append(rawRow);

    const Srow=heatmap([fwd0().S[f].map(()=>0)],{kind:"div",cols:[...Array(16).keys()],colsPlain:true,numbers:true,cell:30,digits:2,scale:1,mask:j=>j>f?false:false,legend:true,legendText:"blue − · red + · hatched = under the card",tip:(i,j,v)=>scored.has(j)?RC.s(cur(),f,j):"not scored yet",onCell:(i,j)=>{if(scored.has(j))setReadout(RC.s(cur(),f,j));}});

    const cur=()=>fwdFor(trained);
    function showTape(j){
      const c=cur();const qv=c.Q[f],kv=c.K[j];const prods=qv.map((x,d)=>x*kv[d]);const sc=maxAbs(prods);
      tiles.forEach((t,d)=>{t.style.background=divColor(prods[d]/sc);t.style.color=cellInk("div",prods[d]/sc);t.textContent=(prods[d]>=0?"+":"−")+Math.abs(prods[d]).toFixed(2).replace(/^0/,"");t.title=`q[${d}] × k[${d}] = ${F3(qv[d])} × ${F3(kv[d])} = ${F3(prods[d])}`;});
      const raw=prods.reduce((a,b)=>a+b,0);

    }
    function paintScores(){const c=cur();const vals=c.S[f].map((v,j)=>scored.has(j)?v:0);const sc=Math.max(0.05,maxAbs(c.S[f].slice(0,n)));Srow.update([vals],sc);Srow.cells[0].forEach((d,j)=>{if(!scored.has(j)&&j<=f){d.style.background="";d.textContent="·";}});krows.forEach((r,j)=>{if(j<=f)r.sc.textContent=scored.has(j)?fmt(c.S[f][j],2):"·";});}
    function dropOnKey(j){
      if(beat===1){
        scored.add(j);manual++;showTape(j);paintScores();setReadout(RC.s(cur(),f,j));
        krows[j].row.classList.add("done");

      if(j!==best){return `Not the top: slot ${j} scores ${fmt(c.S[f][j],2)}; slot ${best} scores ${fmt(c.S[f][best],2)}. Read the tape — agreement is warm tiles, cancellation is cool. Try again.`;}
      scored=new Set([...Array(n).keys()]);paintScores();krows.forEach((r,jj)=>{if(jj<=f)r.row.classList.add("done");});
      peekDone=true;
      toast(`Slot ${best} (${q(w.tokens[best])}) at ${fmt(c.S[f][best],2)}: after training these two summaries agree.`,"good");

      callout(stage,"query · key · score","<span class=\"qtext\">query</span> q = x₀·Wq (what I'm looking for) · <span class=\"ktext\">key</span> k = x₀·Wk (what I'm offering) · <b>score</b> S[i][j] = q<sub>i</sub>·k<sub>j</sub> ÷ √d. Q meets K only. Two different summaries of the same strip, so that a slot can look for something other than itself — and both Wq and Wk are learned.","q");

    let sw=null;
    function afterBeat1(){
      if(beat!==1)return;beat=2;scoreAll.hidden=true;
      const c=fwd0();const mx=maxAbs(c.S[f].slice(0,n));
      coach(`Every score is within ±${F3(mx)} of zero: random summaries find nothing in particular. Flip the switch to <b>Peek: after training</b> — same query, same keys, trained numbers — then drag the query onto the key you think scores <em>highest</em>.`);
      sw=thetaSwitch(stage,v=>{
        trained=v;const c=cur();const m=modelFor(trained);
        qstrip.update(c.Q[f],maxAbs(...c.Q.slice(0,n),...c.K.slice(0,n)));
        kstrips.forEach((ks,j)=>{if(j<=f)ks.update(c.K[j],maxAbs(...c.Q.slice(0,n),...c.K.slice(0,n)));});
        rawStrip.update(c.x0[f]);thWq.update(m.params.Wq);thWk.update(m.params.Wk);
        if(trained&&!peekDone){scored=new Set();krows.forEach(r=>r.row.classList.remove("done"));}

        if(trained&&!peekDone)coach(`Trained numbers. The scores are hidden: drag the query onto the key you think scores highest — the tape will show you why.`);

},

/* ---------------- 6 · The card, for everyone ---------------- */
{
  label:"The card",grp:"Look back",eyebrow:"Step 6 · look back",needsText:true,

  build(stage){

    coach(`Rows ask, columns answer: cell (i, j) is slot i's query against slot j's key. Row <b>${r1}</b> is lit: tap the <em>first</em> column it may NOT see, then Confirm.`);
    const H=heatmap(c.S,{kind:"div",rows:w.tokens.slice(0,T),cols:[...Array(T).keys()],colsPlain:true,cell:20,legend:true,legendText:"blue − · red + · hatched = hidden by the card",
      tip:(i,j,v)=>doneRows.has(i)&&j>i?"−∞ (masked)":`S[${i}][${j}] = ${F3(v)}`,
      onCell:(i,j)=>{setReadout(doneRows.has(i)&&j>i?`S[${i}][${j}] = −∞ (masked)`:RC.s(c,i,j));if(i!==rowsToDo[ri]){toast(`Row ${rowsToDo[ri]} is the one that's lit.`);return;}selected=j;H.highlight(i,j);}});
    H.setMask((i,j)=>doneRows.has(i)&&j>i);
    H.rowHighlight(r1);
    stage.append(H.el);
    const btns=el("div","btnrow");const confirm=el("button","btn small primary","Confirm column");const nothing=el("button","btn small","Nothing to hide");confirm.type="button";nothing.type="button";
    btns.append(confirm,nothing);stage.append(btns);
    function next(){
      doneRows.add(rowsToDo[ri]);ri++;selected=null;H.paint();
      if(ri<rowsToDo.length){const r=rowsToDo[ri];H.rowHighlight(r);coach(r===f?`Row <b>${f}</b> — your slot. Same rule: the first column it may not see.`:`Row <b>${r}</b>, the last slot. Where does its future begin?`);}
      else{
        for(let i=0;i<T;i++)doneRows.add(i);H.paint();H.rowHighlight(-1);
        coach(`A staircase of −∞. In code it's a very large negative number (−10⁹); the effect is the same: e<sup>−∞</sup> = 0 — next step.`,true);
        callout(stage,"causal mask",`Before the share-out, every score in a slot's future is replaced by −∞. Applied <em>before</em> softmax, so the hidden slots get exactly zero and the visible ones still sum to one. The diagonal stays: a slot may look at itself. Why hide anything? Because all ${T} rows are computed in one pass — slot i could otherwise read its own answer straight off slot i+1 and learn to copy instead of to predict.`);
        markDone();
      }
    }
    confirm.addEventListener("click",()=>{
      const r=rowsToDo[ri];
      if(r===15){toast(`Slot 15 is the last; every key is in its past or present. There is nothing to hide — say so.`,"bad");return;}
      if(selected==null){toast("Tap a column in the lit row first.","bad");return;}
      const cc=selected;
      if(cc===r){toast(`Slot ${r} may look at itself — that's the present, and it's allowed. The future starts at ${r+1}.`,"bad");return;}
      if(cc<r){toast(`Column ${cc} is the past. Hiding it would make the model forget what it has already read.`,"bad");return;}
      if(cc>r+1){toast(`Everything from ${r+1} on is hidden — but the <em>first</em> hidden column is ${r+1}.`,"bad");return;}
      toast(`Row ${r}: columns ${r+1}–15 go under the card.`,"good");next();
    });
    nothing.addEventListener("click",()=>{
      const r=rowsToDo[ri];
      if(r!==15){toast(`All 16 rows are computed in one pass, so slot ${r} could read its own answer straight off slot ${r+1}. Hide it, or the model learns to copy instead of to predict.`,"bad");return;}
      toast("Right — the last slot's card is empty.","good");next();
    });
  }
},

/* ---------------- 7 · Share it out ---------------- */
{
  label:"Share out",grp:"Look back",eyebrow:"Step 7 · look back",needsText:true,
  title:"Share it out: scores become weights",
  lede:"Softmax turns any row of scores into shares: all positive, summing to exactly one. Feel what that means before you see the formula.",
  build(stage,token){
    const w=RUN.win,f=w.f,n=f+1,T=CFG.context;
    const S0=fwd0().Smasked[f].slice(0,T);
    const hand=RUN.handRow||new Array(T).fill(0).map((_,j)=>j<=f?1/n:0);
    const order=[...Array(n).keys()].sort((a,b)=>hand[b]-hand[a]||a-b);
    const X=order[0],Y=order.find(j=>j!==X&&j<=f)??(X>0?X-1:1);
    let trained=false,beat=1,snapped=true;
    const vals=S0.slice();
    coach(`Slot ${f} owns exactly <b>1.000</b> of attention. Right now it spreads it evenly — ${(1/n).toFixed(3)} each — because every score is ≈ 0. Push ${q(w.tokens[X])} (slot ${X}) above <b>0.5</b>.`);
    const grid=el("div","sliders");stage.append(grid);
    const rows=[];
    for(let j=0;j<T;j++){
      const r=el("div","srow"+(j>f?" locked":""));
      const lab=el("span","klab",`<span class="i">${j}</span><span class="t">${esc(showTok(w.tokens[j]))}</span>`);
      const inp=el("input");inp.type="range";inp.min=-4;inp.max=4;inp.step=0.05;inp.value=j>f?-4:vals[j];inp.disabled=j>f;
      const sv=el("span","sv",j>f?"−∞":fmt(vals[j],2));
      const lamp=el("span","lamp");const lv=el("span","lv","");
      r.append(lab,inp,sv,lamp,lv);grid.append(r);rows.push({r,inp,sv,lamp,lv});
      inp.addEventListener("input",()=>{if(beat===2&&j===Y){inp.value=vals[j];toast(`Hands off ${q(w.tokens[Y])}. Its share is decided by everyone else's scores as much as by its own — lower the others.`,"bad");return;}vals[j]=+inp.value;snapped=false;paint();check();});
      if(j>f){r.addEventListener("click",()=>toast("−∞ can't be raised. e<sup>−∞</sup> = 0 — the card is absolute, not merely dim.","bad"));}
      lamp.addEventListener("click",()=>toast("You don't set weights directly. You set scores; softmax sets weights."));
    }
    const budget=budgetBar(new Array(T).fill(0),{labels:w.tokens});stage.append(budget.el);
    const btns=el("div","btnrow");const snap=el("button","btn small","Snap back to the model's real scores");snap.type="button";btns.append(snap);stage.append(btns);
    const truthBox=el("div","helper");stage.append(truthBox);
    function softmaxVals(){const vis=vals.slice(0,n);const mx=Math.max(...vis);const e=vis.map(v=>Math.exp(v-mx));const s=e.reduce((a,b)=>a+b,0);const A=new Array(T).fill(0);for(let j=0;j<n;j++)A[j]=e[j]/s;return A;}
    function paint(){const A=softmaxVals();rows.forEach((r,j)=>{r.sv.textContent=j>f?"−∞":fmt(vals[j],2);r.lamp.style.background=seqColor(A[j]);r.lv.textContent=j>f?"0.000":A[j].toFixed(3);});budget.update(A,w.tokens);
      const sc=fwd0().Smasked[f];truthBox.innerHTML=`the model's real row ${f} right now (newborn): ${sc.slice(0,n).map((v,j)=>`<span class="mono">${fmt(v,2)}</span>`).join(" · ")} → ${(1/n).toFixed(3)} each${snapped?"":" · <b>what-if values on screen</b>"}`;}
    function check(){
      const A=softmaxVals();
      if(beat===1&&A[X]>=0.5){beat=2;toast(`${q(w.tokens[X])} has ${A[X].toFixed(3)}. You never lowered anyone, yet they all dimmed — fixed budget.`,"good");coach(`Now get ${q(w.tokens[Y])} (slot ${Y}) to at least <b>0.2</b> — <em>without touching its slider</em>.`);rows[Y].r.classList.add("handsoff");}
      else if(beat===2&&A[Y]>=0.2){beat=3;rows[Y].r.classList.remove("handsoff");toast(`${q(w.tokens[Y])} rose to ${A[Y].toFixed(3)} and you never touched it.`,"good");peekPhase();}
    }
    let sw=null,guessRow=null;
    function peekPhase(){
      coach(`Weights are relative: a share is decided by the whole row. Now flip to <b>Peek: after training</b>: the sliders snap to the trained scores, but the lamps are hidden. Guess the top share, then reveal.`);
      sw=thetaSwitch(stage,v=>{trained=v;
        if(trained){const c=fwdStar();for(let j=0;j<n;j++){vals[j]=c.Smasked[f][j];rows[j].inp.value=clamp(vals[j],-4,4);rows[j].inp.disabled=true;}snapped=false;paint();rows.forEach((r,j)=>{if(j<=f){r.lamp.style.background="";r.lv.textContent="?";}});budget.update(new Array(T).fill(0));
          if(!guessRow){guessRow=el("div","card guess");const A=c.A[f];const jstar=argmax(A.slice(0,n));
            guessRow.innerHTML=`<h3>your guess for the top share <span class="dims">slot ${jstar} (${esc(showTok(w.tokens[jstar]))}) has the highest score, ${fmt(c.Smasked[f][jstar],2)}</span></h3>`;
            const rg=el("div","range");const gi=el("input");gi.type="range";gi.min=0;gi.max=1;gi.step=0.01;gi.value=0.5;const gv=el("b","",gi.value);rg.append(gi,gv);gi.addEventListener("input",()=>gv.textContent=(+gi.value).toFixed(2));
            const rev=el("button","btn small primary","Reveal");rev.type="button";guessRow.append(rg,rev);stage.insertBefore(guessRow,btns);

              rows.forEach((r,j)=>{if(j<=f){r.lamp.style.background=seqColor(A[j]);r.lv.textContent=A[j].toFixed(3);}});budget.update(A,w.tokens);

    const eq=el("div","equations");

      [2,`x₀ = E[ids] + P`,`the strips you looked up, plus the slot's address`],
      [4,`A = softmax(mask(<span class="q">Q</span><span class="k">Kᵀ</span> / √d))`,`query meets key, the card, the share-out — your poured row is one row of A`],
      [7,`x₁ = x₀ + (A·<span class="v">V</span>)Wo`,`the blend of values, added back`],
      [8,`x₂ = x₁ + relu(x₁W1)W2`,`the polish`],
      [8,`p = softmax(x₂Wout)`,`the bet — and its surprise is the loss you drove down`],
    ];
    lines.forEach(([scene,f,cap])=>{const r=el("button","eqline");r.type="button";r.innerHTML=`<span class="f">${f}</span><span class="c">${cap}</span>`;r.addEventListener("click",()=>go(scene));eq.append(r);});
    stage.append(eq);
    stage.append(el("p","helper",`with <span class="q">Q</span> = x₀Wq, <span class="k">K</span> = x₀Wk, <span class="v">V</span> = x₀Wv, d = ${CFG.dModel}, and the loss = mean −log p(next token). Tap a line to revisit it.`));
    // artefacts
    const art=el("div","cols");stage.append(art);
    const a1=el("div","card");a1.append(el("h3","","what you can now say"));
    const say=el("ul","say");
    [`Why one strip becomes three summaries, and why the score is <span class="q">Q</span>·<span class="k">K</span>: a slot needs to look for something other than itself, so “what I'm looking for” and “what I'm offering” are two different learned views of the same numbers — and what gets carried over is a third, the <span class="v">value</span>.`,
     `Why a row of weights sums to one and the future gets exactly zero: softmax is a fixed budget over scores, and the card sets future scores to −∞ before it, so e<sup>−∞</sup> = 0.`,
     `That attention delivers a blend, added back to the slot — it moves information between slots; it decides nothing by itself. The decision is made later, from x₂, by Wout.`,
     `That the pattern is learned, not designed: the same ${N.toLocaleString()} numbers were random at birth; ${CFG.steps.toLocaleString()} gradient steps against the loss moved them until the arithmetic reproduced this text's patterns.`].forEach(s=>say.append(el("li","",s)));
    a1.append(say);art.append(a1);
    const a2=el("div","card");a2.append(el("h3","","your artefacts"));
    if(RUN.trained){const cache=RUN.model.forward(w.ids.slice(0,T));const hand=RUN.handRow||new Array(T).fill(0);
      a2.append(el("div","helper",`row ${w.f} — yours, then the machine's`),seqStrip(hand,{cell:14,mask:j=>j>w.f}).el,seqStrip(cache.A[w.f],{cell:14,mask:j=>j>w.f}).el);
      const ch=lossChart({w:420,h:120,xmax:CFG.steps,ref:{y:RUN.floors.bigram,label:"bigram floor"}});ch.update(RUN.curve||[]);a2.append(el("div","helper","your loss curve (whole text)"),ch.el);}
    if(RUN.generated)a2.append(el("div","helper","what it wrote"),el("div","poem gen",esc(RUN.generated.text)));
    a2.append(el("div","helper",`vocabulary ${V} · tokens ${RUN.ids.length} · parameters ${N.toLocaleString()} · steps ${CFG.steps.toLocaleString()}`));
    art.append(a2);
    stage.append(el("div","card honest",`<h3>an honest note</h3><p>It stored no text; it moved ${N.toLocaleString()} numbers until the arithmetic reproduced this text's patterns. On a text this small that is close to memorising it — which is why it can't say anything new, and why the loss curve flattens so fast.</p><p><b>What GPT adds:</b> many attention heads per layer (each with its own Wq, Wk, Wv, looking for different things at once), dozens of stacked blocks (so a slot can look at what other slots already blended), layer normalisation, sub-word tokens instead of whole words, a context of thousands of slots instead of ${T}, and around 10¹¹ numbers instead of ${N.toLocaleString()} — trained on a good part of the written internet. None of the five lines changes.</p>`));
    const btns=el("div","btnrow");const again=el("button","btn","Play again on another text");again.type="button";again.addEventListener("click",()=>go(0));
    const wipe=el("button","btn quiet small","Reset everything");wipe.type="button";wipe.addEventListener("click",()=>{try{Object.keys(localStorage).filter(k=>k.startsWith("lookback-")).forEach(k=>localStorage.removeItem(k));}catch(e){}location.reload();});
    btns.append(again,wipe);stage.append(btns);
    stage.append(el("p","helper",`Built for <a href="https://github.com/drdoubleb/attention-models">drdoubleb/attention-models</a>: the same model, in NumPy, renders the video series; this page runs it in your browser. Texts: public domain (Rossetti 1872, Dickens 1859, Blake 1794, traditional).`));
  }
},
];

/* ============================ boot ============================ */
readPalette();
const restored=restoreText();
loadProg();
if(!restored){unlocked=0;}
renderRail();
go(restored?Math.min(unlocked,SCENES.length-1)>0?Math.min(unlocked,SCENES.length-1):0:0);
</script>
